[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/augments-labs/crucible-code"
authors = ["Peguy Njoyim"]

# Layering lives here. A crate can only reach what its own `[dependencies]`
# names, and cargo rejects cycles outright — so the arrows below are compiled,
# not reviewed:
#
#   core       -> (nothing)
#   config     -> core            where crucible's files are and what they say
#   provider   -> core
#   tools      -> core
#   runner     -> core            drives turns through traits only
#   tui        -> core
#   crucible-code (this package) -> all six, and is the only place concrete
#                                   types are wired together
#
# `config` sits beside the others rather than above them: it reads files into
# settings and hands them to the wiring, which is what applies them. Nothing
# below reaches up to ask what the user configured.
[workspace.dependencies]
# This workspace's own crates. Path dependencies, released together, so there is
# no version to pin and no third party whose publish could move them.
crucible-config = { path = "crates/crucible-config" }
crucible-core = { path = "crates/crucible-core" }
crucible-provider = { path = "crates/crucible-provider" }
crucible-runner = { path = "crates/crucible-runner" }
crucible-tools = { path = "crates/crucible-tools" }
crucible-tui = { path = "crates/crucible-tui" }

# Argument parsing. `derive` keeps the CLI surface declared next to the type it
# produces rather than in a builder chain that drifts from it.
clap = { version = "=4.6.5", features = ["derive"] }

# Error enums. Every module owns its error type; `thiserror` writes the
# `Display` and `source` impls for it without erasing the type the way a
# boxed error does. Derive only — nothing of it survives into the binary.
thiserror = "=2.0.19"

# The terminal itself. One thing genuinely needs it: the ioctl that reports the
# window size, which is an `unsafe` libc call this workspace forbids writing by
# hand. The escape sequences the renderer emits are plain ANSI, so `crossterm`
# stays confined to one file behind the `Terminal` trait and swapping it out is
# a day, not a rewrite. A full-screen renderer would also want its raw mode,
# which is the other reason it is this crate rather than a bare `ioctl` binding.
crossterm = "=0.29.0"

# HTTP. Blocking by design: this workspace runs threads rather than an async
# runtime, and the alternative client would pull `tokio` in to serve one socket
# per turn. Brings `rustls` rather than linking a system OpenSSL, so a release
# binary is the same on every machine. Confined to one file behind `Transport`.
# Default features minus `gzip`: a response here is an event stream that is read
# as it arrives, and compressing one buys nothing for the `flate2` it costs.
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

# Search, and the directory walk that feeds it. These are ripgrep's own crates.
# The budget is "grep within 1.25x of the rg binary", and the way to hold it is
# to do what rg does rather than to re-derive it: `ignore` reads .gitignore the
# way git does, `globset` compiles many patterns into one automaton instead of
# testing each in turn, and `grep-searcher` owns the buffering, the binary
# sniffing and the line-terminator handling that read-to-string-and-split gets
# wrong on exactly the large files where the budget is decided.
ignore = "=0.4.33"
globset = "=0.4.20"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"

# JSON. Every wire protocol here speaks it, and hand-rolling the parser would
# mean hand-rolling string escapes and surrogate pairs — where a mistake is a
# silently wrong answer rather than a crash. Used without `derive`: the vendor
# shapes differ per provider and are read once at the boundary, so a set of
# mirror structs per provider would be more code than the field lookups.
serde_json = "=1.0.151"

# Display width. A terminal wraps by columns, not by characters: CJK takes two
# and a combining mark takes none, so counting `char`s puts the cursor somewhere
# the renderer did not predict and the next frame erases the wrong lines. This
# is the Unicode Annex #11 table as data, with no dependencies of its own.
unicode-width = "=0.2.2"

# --- Encoded standards -------------------------------------------------------
# These lint tables are the standard. A rule that cannot be expressed here, in
# `clippy.toml`, or in `scripts/check.sh` is not enforceable and does not exist.
# Every crate opts in with `[lints] workspace = true`.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# No panicking paths in shipped code. Tests are exempt via `clippy.toml`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"

# Terminal output goes through the renderer, never an ad-hoc macro, so the
# render path stays measurable and a stray print cannot corrupt the transcript.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Cheap correctness traps that pedantic leaves at allow.
float_cmp = "deny"
mem_forget = "deny"
rc_buffer = "deny"

# Function length. The per-file cap lives in `scripts/check.sh`; the compiler
# cannot see file boundaries.
too_many_lines = "deny"

# Pedantic lints that fight the house style rather than serving it.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "crucible-code"
description = "The harness where agents are forged."
readme = "README.md"
keywords = ["agent", "cli", "tui", "llm", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# One shipped binary. The short `cru` name is a symlink created by the
# installer, not a second target — a second `[[bin]]` would compile and ship
# the same code twice. Auxiliary binaries under `src/bin/` are bench probes and
# are not part of a release.
[[bin]]
name = "crucible"
path = "src/main.rs"

# All five, and only here. Every crate below reaches core and nothing else; the
# arrows that make an Anthropic provider and a bash tool meet a runner are drawn
# in this package or they are not drawn at all.
[dependencies]
clap.workspace = true
crucible-config.workspace = true
crucible-core.workspace = true
crucible-provider.workspace = true
crucible-runner.workspace = true
crucible-tools.workspace = true
crucible-tui.workspace = true
thiserror.workspace = true

# The same runner, with the seam that lets a test hand it a log which fails on
# every write. Cargo does not resolve dev-dependencies for a build, so this
# turns the feature on for `cargo test` and for nothing that ships.
[dev-dependencies]
crucible-runner = { workspace = true, features = ["proof"] }

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Panics are denied by lint, so unwinding machinery is dead weight in the
# binary. A session survives an abort regardless: the transcript is an
# append-only log already on disk, not state flushed at exit.
panic = "abort"

[profile.bench]
inherits = "release"
