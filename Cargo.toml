[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.42.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/augments-labs/crucible-code"
authors = ["Peguy Njoyim"]
publish = false

# Layering lives here. A crate can only reach what its own `[dependencies]`
# names, and cargo rejects cycles outright, so the edges are compiled rather
# than reviewed. Which edges are allowed is one list, in the crate-layering
# section of `scripts/sh/repo-checks.sh`, checked against these manifests on
# every run. It is not restated here: an arrow written down twice goes stale in
# one of the two places without anything failing. What each crate is for is in
# CLAUDE.md.
#
# `config` sits beside the others rather than above them: it reads files into
# settings and hands them to the wiring, which is what applies them. Nothing
# below reaches up to ask what the user configured. `auth` sits there too, and
# is handed the directory `config` resolved rather than resolving one itself.
[workspace.dependencies]
# Reads image pixels from the desktop clipboard for Ctrl+V attachment ingress.
# Wayland's clipboard is a separate protocol rather than an X11 compatibility
# path, so its backend is named outright instead of leaving Linux support to
# whichever display server happens to be in use.
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
# Encodes the clipboard's RGBA pixels as the PNG every provider accepts. The
# same release is already in arboard's image-data graph, so this names the API
# without compiling a second encoder.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# This workspace's own crates. Path dependencies, released together, so there is
# no version to pin and no third party whose publish could move them.
crucible-agents = { path = "crates/crucible-agents" }
crucible-app = { path = "crates/crucible-app" }
crucible-attachments = { path = "crates/crucible-attachments" }
crucible-auth = { path = "crates/crucible-auth" }
crucible-builtins = { path = "crates/crucible-builtins" }
crucible-client-api = { path = "crates/crucible-client-api" }
crucible-config = { path = "crates/crucible-config" }
crucible-context = { path = "crates/crucible-context" }
crucible-core = { path = "crates/crucible-core" }
crucible-credentials = { path = "crates/crucible-credentials" }
crucible-extension = { path = "crates/crucible-extension" }
crucible-http = { path = "crates/crucible-http" }
crucible-mcp = { path = "crates/crucible-mcp" }
crucible-models = { path = "crates/crucible-models" }
crucible-privacy = { path = "crates/crucible-privacy" }
crucible-provider = { path = "crates/crucible-provider" }
crucible-registry = { path = "crates/crucible-registry" }
crucible-runner = { path = "crates/crucible-runner" }
crucible-runtime = { path = "crates/crucible-runtime" }
crucible-sandbox = { path = "crates/crucible-sandbox" }
# Static PID 1 executable and its four-byte raw-wait-status protocol. What the
# native backends name on the library side describes and probes a launch;
# supervising one confined command is the separately built binary's alone. The
# Windows account the native backend runs under is created and removed here
# too, which is why the CLI reaches this crate directly for those two commands.
crucible-sandbox-broker = { path = "crates/crucible-sandbox-broker" }
crucible-sandbox-local = { path = "crates/crucible-sandbox-local" }
crucible-session = { path = "crates/crucible-session" }
crucible-storage = { path = "crates/crucible-storage" }
crucible-tools = { path = "crates/crucible-tools" }
crucible-transport = { path = "crates/crucible-transport" }
crucible-tui = { path = "crates/crucible-tui" }
crucible-types = { path = "crates/crucible-types" }
crucible-update = { path = "crates/crucible-update" }
crucible-workspace = { path = "crates/crucible-workspace" }

# The executor work in flight is owned by. `std` has threads but no way to own a
# set of them as one thing: a scheduler that can stop admitting, cancel what it
# started and be awaited to empty is what keeps a turn's tasks from outliving
# the turn, and writing that over `std::thread` means writing the scheduler.
# Features are named per crate rather than here, so a crate that needs the
# executor does not compile the process, network and file integrations that
# belong to the boundaries owning them; `full` is not used anywhere.
tokio = { version = "=1.53.1", default-features = false }

# Argument parsing. `derive` keeps the CLI surface declared next to the type it
# produces rather than in a builder chain that drifts from it.
clap = { version = "=4.6.7", features = ["derive"] }

# Error enums. Every module owns its error type; `thiserror` writes the
# `Display` and `source` impls for it without erasing the type the way a
# boxed error does. Derive only — nothing of it survives into the binary.
thiserror = "=2.0.20"

# Asks the terminal what colour its own background is, over OSC 11, and reads
# the answer. `std` has no timed read on a file descriptor and `crossterm` has
# neither the query nor a way to see the reply — its parser consumes stdin and
# surfaces only keys, so a reply arriving there is swallowed. What is left is a
# protocol, a timeout, and a different answer on every platform, which is more
# than a few lines and exactly what this crate is. It is what lets the row a
# prompt is left on take a ground blended off the reader's own, instead of one
# this project guessed at.
terminal-colorsaurus = "=1.0.3"

# Parses fenced code so it can be drawn in more than one colour, and reads the
# `.tmTheme` files that say what those colours are — which is the format every
# syntax theme a reader already owns is written in. Default features are off on
# purpose: they select `oniguruma`, a C regex library, and a C toolchain is a
# build and supply-chain surface this tree does not want for a regex engine.
# `regex-fancy` is the pure-Rust engine instead, three times slower per line and
# far inside the frame budget. Everything else here is the smallest set that
# loads the built-in syntaxes and a theme file: no HTML output, no compiling
# syntax definitions from source.
syntect = { version = "=5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
    "dump-load",
    "plist-load",
] }

# The syntax themes people actually name — Monokai, GitHub, Dracula, Nord,
# gruvbox, Solarized and the rest. `syntect` alone ships seven, every one of
# them base16 or Solarized, and a theme picker whose list nobody recognises is a
# picker nobody uses. This is the same collection `bat` draws on, packaged for
# syntect, so the names in the list are the names a reader already has an
# opinion about.
two-face = { version = "=0.5.2", default-features = false, features = [
    # `syntect-fancy` and not `syntect-default-fancy`: the latter turns on
    # syntect's whole default set, which drags in HTML output, dump *creation*
    # and a YAML parser for compiling syntax definitions from source. None of
    # the three is reachable from here — the syntaxes and themes are loaded
    # from the binary dumps this crate already ships — and cargo unifies
    # features, so asking for them here would put them back into the build the
    # syntect entry above deliberately left them out of.
    "syntect-fancy",
] }

# `insta` compares what a component drew against a file checked in beside it.
# A test only reaches for it where the thing under test is a *picture*: what a
# row looks like at forty columns, in ascii, under a mode's colour. Those are
# assertions this repository was already making by hand — a `vec!` of formatted
# strings inline in the test — and a hand-written one is the same claim in a
# form nobody can review, because a diff of it is a diff of Rust rather than of
# the screen. What it must not be reached for is an invariant: "no row is wider
# than the terminal" is a property, it is tested as one, and a snapshot would
# assert the answer instead of the rule. Dev-only, so nothing here ships.
insta = "=1.48.0"

# The terminal itself. One thing genuinely needs it: the ioctl that reports the
# window size, which is an `unsafe` libc call this workspace denies writing by
# hand. The escape sequences the renderer emits are plain ANSI, so `crossterm`
# stays confined to one file behind the `Terminal` trait and swapping it out is
# a day, not a rewrite. A full-screen renderer would also want its raw mode,
# which is the other reason it is this crate rather than a bare `ioctl` binding.
# Bracketed paste is enabled so a paste arrives as one event rather than as a
# run of keystrokes: that is what keeps its newlines, which key events spell as
# submissions. Crossterm buffers the block until its terminator with no bound of
# its own, so the bound is applied where the text lands — `Editor::paste` caps
# what is retained, and a paste that never terminates is one a terminal does not
# send. `derive-more` is not used.
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows", "bracketed-paste"] }

# The sandbox's host proxy parses bounded HTTP/1 headers and chunk framing with
# caller-owned buffers; std has no HTTP parser. Already in the tree under
# `hyper`, which parses every request and response head it is handed.
httparse = "=1.10.1"
# URI authorities and header names at the proxy boundary need a complete HTTP
# grammar, including bracketed IPv6 and absolute-form targets. Already in the
# tree under `hyper` and `http-body`.
http = "=1.5.0"

# HTTP, asynchronously: a client whose request waits on the runtime rather than
# on a thread of its own. `hyper` is the
# HTTP/1.1 framing, the response head's size limits and the close of a
# connection whose request was dropped; `http1` alone, so no HTTP/2 is compiled.
# `std` has sockets and no HTTP.
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1"] }
# The pooled client over `hyper`, and the connector that takes a custom
# resolver: the seam where `crucible-http` applies a lookup's deadline and
# bound. `client-legacy` is that client and connector, and the `CONNECT`
# tunnel a proxy is reached through; the environment proxy matcher
# (`client-proxy`) and the platform proxy discovery are not compiled, because
# neither chooses a proxy the way the client before this one did. `tokio`
# joins them to tokio's sockets.
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
# The trait a connector is written against, which the client above names in
# its bounds. Already in its graph; named here so a connector can implement it.
tower-service = "=0.3.3"
# TLS. One stack, in Rust, over `ring` rather than the default `aws-lc-rs`, a C
# library this tree does not build; TLS 1.2 is kept beside 1.3 as it was before.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
# The same TLS over an asynchronous socket: the reads, writes, wakeups and
# close-notify a handshake and its records need, which `rustls` leaves to its
# caller. Default features off for the same reason as above.
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
# The Mozilla root set a server's certificate is checked against, compiled in:
# no system store, bundle or platform verifier is read, so a certificate is
# trusted the same way on every machine. Named here for `crucible-http`, the one
# crate that builds a client to verify a recipient.
webpki-roots = "=1.0.9"

# JWT claims are base64url without padding. OpenAI subscription login needs the
# selected ChatGPT account id from that bounded claim set; this decoder is
# already present through rustls and avoids growing a second, partial codec at
# the credential boundary. The three wire protocols need the same codec the
# other way, because every one of them carries an attached file as base64 text,
# and this encoder appends into the body being built rather than returning a
# second copy of a request's worth of bytes. A forward proxy's user information
# is encoded with it too, and sent to the proxy as a `Basic` credential.
base64 = "=0.23.1"

# OAuth PKCE and stable installation identifiers need bytes from the operating
# system's cryptographic random source. This is the small cross-platform
# boundary for that call; no pseudo-random generator or global state ships.
getrandom = "=0.4.3"

# Session identifiers are UUID v7: a 48-bit millisecond timestamp in front
# keeps sorting the names as text equal to sorting the sessions by start time,
# and `now_v7` additionally orders ids minted within the same millisecond of
# one process. The version and variant bit layout, the monotonic tie-break
# counter, and the timestamp recovery are format machinery this crate owns;
# `std` cannot mint one and hand-rolling it would be a second partial codec.
uuid = { version = "=1.26.1", features = ["v7"] }

# Browser OAuth uses RFC 7636 S256. Prompt-cache scope identity also needs a
# one-way digest of credential-owned material so an API key can keep the same
# fail-closed identity after restart without ever persisting the key. Keeping
# SHA-256 at those two credential boundaries avoids partial handwritten digest
# implementations, and the crate has no runtime or platform dependencies.
sha2 = { version = "=0.11.0", default-features = false }

# Search, and the directory walk that feeds it. These are ripgrep's own crates.
# The budget is "grep within 1.25x of the rg binary", and the way to hold it is
# to do what rg does rather than to re-derive it: `ignore` reads .gitignore the
# way git does, `globset` compiles many patterns into one automaton instead of
# testing each in turn, `grep-searcher` owns the buffering, the binary sniffing
# and the line-terminator handling that read-to-string-and-split gets wrong on
# exactly the large files where the budget is decided, and `grep-regex` is the
# matcher it runs with — the half that turns a pattern into something applied to
# a buffer rather than to a string.
ignore = "=0.4.33"
globset = "=0.4.20"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"

# JSON. Every wire protocol here speaks it, and context snapshots use its value
# tree for the RFC 7386 merge-patch boundary. Hand-rolling either parser would
# mean hand-rolling string escapes and surrogate pairs — where a mistake is a
# silently wrong answer rather than a crash. Used without `derive`: the vendor
# shapes differ per provider and are read once at the boundary, while context
# snapshots are already values rather than mirror structs.
serde_json = "=1.0.151"

# The traits `serde_json`'s reader drives, without serde's derive. A frame from
# a client is hostile input, and the only way to stop reading one at the entry,
# level or value that goes over its bound, or at a key said twice — rather
# than after the whole tree is in memory — is to hand the reader a visitor that
# counts. `serde_json` does not re-export the traits a visitor implements.
# Already in the graph as its dependency, at this version.
serde_core = "=1.0.229"

# Display width. A terminal wraps by columns, not by characters: CJK takes two
# and a combining mark takes none, so counting `char`s puts the cursor somewhere
# the renderer did not predict and the next frame erases the wrong lines. This
# is the Unicode Annex #11 table as data, with no dependencies of its own.
unicode-width = "=0.2.2"

# `openat`, and the flags that decide what one component of a path may be. A
# path is proven inside the workspace and then opened, and between those two
# moments anything else on the machine that can write there can make the same
# name lead somewhere else. What closes that is opening one component at a time
# against a descriptor for the directory before it, refusing a symbolic link at
# each step — and `std` has no call that takes a directory to resolve against,
# only ones that take a whole path and resolve it afresh. The system call itself
# is `unsafe` through `libc`, which this workspace denies, and this is the safe
# wrapper for it. Unix targets only, where `openat` is the platform's own idea;
# already in the tree under `crossterm`, so this turns a feature on rather than
# adding a crate. Every call stays behind the boundary of the crate that made
# it; the manifests naming this crate are the list of those boundaries.
#
# `process` is the same argument about a second call. Stopping a command means
# stopping the pipeline it started rather than the shell at the head of it, and
# that is `kill` on a negated process group id — which `std` has no call for
# either. It is a separate feature, so the manifests turning it on are the list
# of crates that may make that call.
rustix = { version = "=1.1.5", features = ["fs"] }

# Compiles the bounded Linux seccomp program without hand-maintained BPF or
# syscall tables. The broker applies the prebuilt program only in the final
# workload child, where bind/listen and io_uring network setup are forbidden.
seccompiler = { version = "=0.5.0", default-features = false }

# Supplies kernel syscall numbers seccompiler does not name on every supported
# Linux architecture; the workspace already locks this exact libc.
libc = "=0.2.189"

# Being told to stop from outside. A closed window or a `kill` arrives as a
# signal, and `std` has no way to hear one: without a handler the process ends
# where it stands, with the log writer unjoined and the answer on screen never
# written down. Installing a handler is `sigaction` through `libc`, which is
# `unsafe` and which this workspace denies; this is the safe wrapper, and all
# it is asked for is its flag module — a handler that stores one atomic and
# returns, which is the whole of what may be done in a signal context — and the
# call that afterwards ends the process the way the signal would have. Unix
# only. Already in the tree under `crossterm` at this version with more turned
# on than this, so nothing new is compiled.
signal-hook = { version = "=0.3.18", default-features = false }

# Windows has no file mode, so the 0600 a session log is held at has to be
# written as a DACL instead: one entry, for the account crucible is running as,
# with the inheritance from the user profile switched off. Nothing in `std`
# reaches that call and no safe wrapper is maintained — the one on crates.io was
# last published in 2021, which is not what security-critical code should be
# resting on. Already in the tree for Windows targets under `hyper`, `tokio` and
# `ignore`, so it costs no crate that was not being compiled already. Every call
# stays behind the target-gated boundary of the crate that made it; the
# manifests naming this crate are the list of those boundaries.
# The WDK file-system surface contributes the one ntdll rename call whose
# directory-relative contract the Win32 wrapper does not honor consistently;
# JobObjects, ToolHelp and Pipes contain and poll spawned command descendants.
# Native sandbox setup additionally uses the local-account, DPAPI, Windows
# Filtering Platform, registry and synchronization APIs. The bindings add no
# runtime library.
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

# --- Encoded standards -------------------------------------------------------
# These lint tables are the Rust compiler standard. Cross-file repository
# policy is enforced by `scripts/sh/repo-checks.sh`.
# Every crate opts in with `[lints] workspace = true`.

[workspace.lints.rust]
# `deny` rather than `forbid`, which it was until Windows became a target this
# tree ships. Holding a session log out of another account's reach is a file
# mode on Unix and a DACL on Windows, and the call that writes a DACL is FFI —
# there is no safe way to make it, only a choice about where the unsafe lives.
# `forbid` cannot be opted out of anywhere, so it would have moved that code
# into a third-party crate rather than removed it, which is the same unsafe with
# less review. `deny` keeps every file in this tree an error by default and
# makes each exception appear in the diff that introduces it, spelled out,
# where it can be argued with. Each is written where it applies, with its
# own stated `reason`.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# No panicking paths in shipped code. Tests are exempt via `clippy.toml`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
exit = "deny"

# Terminal output goes through the renderer, never an ad-hoc macro, so the
# render path stays measurable and a stray print cannot corrupt the transcript.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Cheap correctness traps that pedantic leaves at allow.
float_cmp = "deny"
mem_forget = "deny"
rc_buffer = "deny"

# Every unsafe boundary explains the proof the compiler cannot make. Unsafe code
# itself is denied above except in the reviewed platform modules; this lint owns
# the mechanically checkable part of keeping those exceptions auditable.
undocumented_unsafe_blocks = "deny"

# Function length. The per-file cap lives in `scripts/sh/repo-checks.sh`; the compiler
# cannot see file boundaries.
too_many_lines = "deny"

# Pedantic lints that fight the house style rather than serving it.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "crucible-code"
description = "The harness where agents are forged."
publish.workspace = true
readme = "README.md"
keywords = ["agent", "cli", "tui", "llm", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `cargo run` has six targets to choose between — this one and the five bench
# probes under `src/bin/`, which cargo compiles as binaries of this package
# whether or not a release ships them. Without this key it refuses to choose and
# asks for `--bin`, which is a question about this repository's layout put to
# somebody who only wanted to start crucible.
default-run = "crucible"

# One shipped binary. The short `cru` name is a symlink created by the
# installer, not a second target — a second `[[bin]]` would compile and ship
# the same code twice. Auxiliary binaries under `src/bin/` are bench probes and
# are not part of a release.
[[bin]]
name = "crucible"
path = "src/main.rs"

# Every crate the binary composes, and only here. It uses the lower-level
# privacy boundary for its user configuration; that crate knows nothing about
# settings. The arrows that make a provider and a tool meet a runner are still
# drawn here or nowhere.
[dependencies]
arboard.workspace = true
# Two unrelated features, one entry: `rt-multi-thread` and `time` are the
# runtime the tools and grep probes build for themselves, shaped as the
# application's — several threads and a clock. Each waits on it for the calls
# it times, lends those calls a tool worker on it, and the tools probe watches
# its sandbox command on it. `net` is the I/O driver that command's output is
# read through on Unix, as the application's runtime has it. The command line
# itself names none of that runtime; it reaches the application's own through
# `crucible-app`. `sync` is the one-shot channel a pending permission question
# or ask answers through: a human's reply is human-length, so the drawing
# thread that holds the sending half must be able to hand it over without the
# turn thread blocking inside a poll to receive it.
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
# The composition root: every concrete provider, tool, server and session a run
# is assembled from, and the conversation the command line then drives. The
# command line adapts it to a terminal and adds nothing to it.
crucible-app.workspace = true
# The requests the terminal makes of the application, which are the ones any
# front end makes: the command line is one client of that contract.
crucible-client-api.workspace = true
clap.workspace = true
crucible-attachments.workspace = true
crucible-auth.workspace = true
crucible-builtins.workspace = true
crucible-config.workspace = true
crucible-context.workspace = true
crucible-core.workspace = true
crucible-privacy.workspace = true
crucible-provider.workspace = true
# Release discovery and the cached release check, composed by the application
# and read by the command line's opening path.
crucible-update.workspace = true
crucible-runner.workspace = true
# The future an asynchronous contract hands back, which the command line and
# its probes implement, and the bridge the `/sandbox` panel crosses to ask the
# local backend while the command line is synchronous.
crucible-runtime.workspace = true
# The main binary exposes the explicit Windows administrator setup and removal
# commands from the same audited crate that owns the native broker. Running the
# already-selected Crucible image directly avoids elevating a mutable sibling
# helper or a command assembled through a shell.
crucible-sandbox-broker.workspace = true
# The composition root is where a machine is named: it hands the native
# confinement to every tool that runs a command, so no tool has to name an
# operating system.
crucible-sandbox-local.workspace = true
# The tool worker the tools and grep probes lend the calls they time, so what
# they time includes handing the work to it. Nothing the command line ships
# names it.
crucible-tools.workspace = true
# The file a persistent prompt-cache resource is remembered in. Composition
# hands the store to the runner, which keeps records through the contract and
# never names the file.
crucible-session.workspace = true
crucible-tui.workspace = true
image.workspace = true
# The hash an attachment is recorded under, taken here because this is where a
# file is attached and the runner compares it on every request afterwards. Both
# sides read the same definition off `Attachment::hash`, and the crate is
# already in the graph twice over — the session log and the credential store —
# so this is the same version compiled once.
sha2.workspace = true
# One answer to read: GitHub names the newest release in a JSON body, and the
# release check here is the only thing in this package that reads a wire format
# at all. Already in the workspace for the session log and the configuration
# documents, so this is the same version compiled once.
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Named by the integration tests alone, which drive the seams these two own from
# outside: what an extension sweep finds, and what hosting a server comes to.
# The shipped command line reaches both through the application crate and names
# neither, which the repository gate holds it to.
crucible-extension.workspace = true
crucible-mcp.workspace = true
# The same session crate the runner re-exports, with the seam that lets a test
# hand it a log which fails on every write. Cargo does not resolve
# dev-dependencies for a build, so this turns the feature on for `cargo test`
# and for nothing that ships.
crucible-session = { workspace = true, features = ["proof"] }
# The macro a test answers a fake service's future with, for the tests that
# drive one by hand.
crucible-runtime = { workspace = true, features = ["proof"] }
# The confinement the command line runs commands under, keeping its sandbox
# state in a directory of this checkout's while the integration tests run it, so
# another checkout's tests never lock, recover or change it. Named here as well
# as through the application, because a narrow `cargo test -p crucible-code`
# builds no other package's dev-dependencies.
crucible-sandbox-local = { workspace = true, features = ["per-checkout-state"] }
insta.workspace = true
# The runtimes a test waits for a turn on now that a turn is asynchronous: a
# current-thread one to drive a runner a test holds, and a multi-thread one
# standing where the application's own runtime stands for a conversation.
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The Linux benchmark probes run the shipped binary behind a controlling pseudo
# terminal and render into a bounded kernel pipe, and the one test that runs
# crucible the way a person does drives it through a pty the same way. `std`
# can spawn the process and read the descriptors but cannot open the pty pair,
# put its far side in raw mode, set its window size, bound a pipe or say how
# long the clock tick is that `/proc` counts a process's CPU time in. `rustix`
# and its version are already in the runtime graph, so this turns features on
# rather than adding a crate; only the safe system-call wrappers the probes and
# that test name become reachable, and no pty or pipe code is reached by
# crucible itself.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["param", "pipe", "pty", "termios"] }

# What hears a hang-up or a termination while a turn is running, so the turn is
# stopped and written down instead of lost. Signals are the Unix spelling of
# that; a closing console on Windows is a different mechanism this does not
# reach.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwinding, left at the default and written down because the tempting change is
# to abort: panics are denied by lint here, so the machinery reads as dead
# weight. It is not. The lint reaches this workspace and not crossterm's reader,
# hyper's, tokio's, or a failed allocation — and raw mode, mouse reporting and
# the tab title are handed back by `Drop`, which an abort does not run. The
# transcript survives either way, being an append-only log already on disk; the
# terminal does not, and the user's remedy is `reset`, which most people do not
# know. Unwinding also makes `Fatal::Lost` reachable, so a turn thread that dies
# becomes an exit code from `main` rather than an abort in the middle of a
# frame. The price is about 465 KB of landing pads on a 5 MB binary and nothing
# at run time.
#
# `crucible-tui`'s guards refuse to compile against `panic = "abort"`, so this
# cannot be quietly undone by a profile somewhere else.

[profile.bench]
inherits = "release"
