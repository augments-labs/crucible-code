name: blocking-ci

on:
  pull_request: {}
  push:
    branches: [main, dev]

# A newer push to a pull request replaces its run. A push to main or dev is
# never cancelled: it is the only run that tests every platform, so each merged
# commit keeps its own.
concurrency:
  group: blocking-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency policy
    uses: ./.github/workflows/dependency-policy.yml

  performance:
    name: Performance
    uses: ./.github/workflows/performance.yml

  repo-checks:
    name: Repository checks
    uses: ./.github/workflows/repo-checks.yml

  python-ci:
    name: Python CI
    uses: ./.github/workflows/python-ci.yml

  # No test that runs only on macOS or Windows reads a document, so a pull
  # request that changes nothing else leaves those platforms to the run its
  # merge makes, and Linux still runs every test. scripts/sh/docs-only.sh says
  # which files count. A pull request's checkout is its merge into the base,
  # so the merge's first parent is what it changes from.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            docs_only=$(git diff --name-only --no-renames -z HEAD^1 HEAD | scripts/sh/docs-only.sh)
          else
            docs_only=false
          fi
          echo "docs-only: $docs_only"
          echo "docs-only=$docs_only" >>"$GITHUB_OUTPUT"

  rust-ci:
    name: Rust CI
    needs: changes
    uses: ./.github/workflows/rust-ci.yml
    # A pull request is tested on the platforms rust-ci.yml names for it; the
    # push its merge makes is tested on all of them.
    with:
      all-platforms: ${{ github.event_name == 'push' }}
      docs-only: ${{ needs.changes.outputs.docs-only == 'true' }}

  required:
    name: CI required
    if: ${{ always() }}
    needs:
      - changes
      - dependency-policy
      - performance
      - repo-checks
      - python-ci
      - rust-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          CHANGES: ${{ needs.changes.result }}
          DEPENDENCY_POLICY: ${{ needs.dependency-policy.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          REPO_CHECKS: ${{ needs.repo-checks.result }}
          PYTHON_CI: ${{ needs.python-ci.result }}
          RUST_CI: ${{ needs.rust-ci.result }}
        run: |
          set -euo pipefail

          failed=0
          for result in \
            "changes=$CHANGES" \
            "dependency-policy=$DEPENDENCY_POLICY" \
            "performance=$PERFORMANCE" \
            "repo-checks=$REPO_CHECKS" \
            "python-ci=$PYTHON_CI" \
            "rust-ci=$RUST_CI"; do
            name=${result%%=*}
            state=${result#*=}
            echo "$name: $state"
            if [[ "$state" != success ]]; then
              failed=1
            fi
          done

          exit "$failed"
