name: dependency-policy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Licenses, sources and bans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Docker action has its own isolated Cargo home, so `--offline` on a
      # fresh runner cannot see the crates Cargo fetched for this workspace.
      # Install the official static binary by digest instead, populate Cargo's
      # locked cache, then cut network access off for the policy decision.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          archive="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --silent \
            --show-error --output "$RUNNER_TEMP/cargo-deny.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$archive"
          printf '%s  %s\n' "$CARGO_DENY_SHA256" "$RUNNER_TEMP/cargo-deny.tar.gz" |
            sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar xzf "$RUNNER_TEMP/cargo-deny.tar.gz" \
            -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          echo "$RUNNER_TEMP/cargo-deny" >>"$GITHUB_PATH"

      - name: Populate the locked Cargo cache
        run: cargo fetch --locked

      # Bans belongs with these two rather than with advisories: what it decides
      # is read entirely out of the lockfile in front of it, so the answer only
      # changes when a dependency changes, and it is the same answer today and
      # in a year. Advisory data is not, which is why it has its own schedule.
      - name: Check deterministic license, source and ban policy offline
        run: cargo-deny --locked --offline check licenses sources bans

      - uses: ./.github/actions/check-clean-worktree
