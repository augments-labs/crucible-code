name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  macos-mach-inventory:
    name: macOS extra Mach rights removal diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: bash
      run: |
        set -eu
        CRUCIBLE_RUNTIME_PROBE_VARIANT=ssl-pagesize sh .github/probes/macos-mach.sh
