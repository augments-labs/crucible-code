name: native-sandbox-experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bootstrap:
    name: Windows final-token bootstrap
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./.github/probes/windows-bootstrap.ps1
