name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows-system-access:
    name: Windows SYSTEM read-only handle prerequisite
    runs-on: windows-2025
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Get-FileHash .github/probes/windows-system-access.ps1 -Algorithm SHA256 | Select-Object Hash
        ./.github/probes/windows-system-access.ps1
