name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows-runtime-acl:
    name: Windows runtime object ACL feasibility
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: pwsh
      run: .github/probes/windows-runtime-acl.ps1
