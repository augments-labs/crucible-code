name: rust-ci

on:
  workflow_call:
    inputs:
      all-platforms:
        description: Test on every platform, not only those a pull request waits for
        type: boolean
        default: true
      docs-only:
        description: The pull request changes only documentation, so macOS and Windows are left to its merge
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Test on every platform, not only those a pull request waits for
        type: boolean
        default: true

permissions:
  contents: read

# Line tables are what a backtrace reads; the rest of the debug information
# only makes every test binary slower to link and every cache larger.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# The gate is spread over machines so that a run waits for its slowest part
# rather than for the sum of them. Each machine builds the tests it runs for
# itself, which costs less than handing it binaries built elsewhere. A part of
# the suite is chosen by hashing each test's name, so a test added lands in one
# part without anyone listing it, and a section added to the Rust gate is run
# by the job that names only what it leaves out.
jobs:
  linux-tests:
    name: Linux tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every part builds the same tests, so one of them saves what it built.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-ubuntu-latest
          save-if: ${{ matrix.shard == 1 }}
      # A prebuilt cargo-nextest, checked against its published checksum, in
      # seconds rather than the minutes building it would take.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146

      # The gate runs on the enforcing sandbox host, and a missing backend is
      # a failure rather than a skip; the action says why.
      - uses: ./.github/actions/enforcing-sandbox
      - run: scripts/sh/rust-checks.sh --only tests --partition hash:${{ matrix.shard }}/4
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      # A test that regenerated a committed file found it stale.
      - uses: ./.github/actions/check-clean-worktree

  # The required cases rerun sandbox tests among others, so this job runs on
  # the enforcing host too.
  linux-required:
    name: Linux required cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-ubuntu-latest
          save-if: false
      - uses: ./.github/actions/enforcing-sandbox
      - run: scripts/sh/rust-checks.sh --only examples,required
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      - uses: ./.github/actions/check-clean-worktree

  linux-checks:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks-ubuntu-latest
      - run: scripts/sh/rust-checks.sh --skip tests,examples,required
      - uses: ./.github/actions/check-clean-worktree

  platform-tests:
    name: ${{ matrix.name }} tests ${{ matrix.shard }}/${{ matrix.shards }}
    if: ${{ !inputs.docs-only }}
    runs-on: ${{ matrix.os }}
    # The macOS Intel tests have run 12 to 19 minutes in one job and gone past
    # 20 under load. The limit is there to catch a hang, not to time the suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # macOS Intel and Windows ARM64 are the slowest platforms to test, so a
      # pull request leaves them to the run on dev that follows its merge,
      # and compiles for Windows ARM64 in the job below instead. Apple silicon
      # runs its tests in one part: macOS machines are the ones a run queues
      # longest for, and a second one costs more waiting than it saves.
      matrix:
        include: >-
          ${{ fromJSON(inputs.all-platforms && '[
          {"name": "macOS Intel", "os": "macos-15-intel", "shard": 1, "shards": 2},
          {"name": "macOS Intel", "os": "macos-15-intel", "shard": 2, "shards": 2},
          {"name": "macOS Apple silicon", "os": "macos-26", "shard": 1, "shards": 1},
          {"name": "Windows x86_64", "os": "windows-latest", "shard": 1, "shards": 2},
          {"name": "Windows x86_64", "os": "windows-latest", "shard": 2, "shards": 2},
          {"name": "Windows ARM64", "os": "windows-11-arm", "shard": 1, "shards": 2},
          {"name": "Windows ARM64", "os": "windows-11-arm", "shard": 2, "shards": 2}]' || '[
          {"name": "macOS Apple silicon", "os": "macos-26", "shard": 1, "shards": 1},
          {"name": "Windows x86_64", "os": "windows-latest", "shard": 1, "shards": 2},
          {"name": "Windows x86_64", "os": "windows-latest", "shard": 2, "shards": 2}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests-${{ matrix.os }}
          save-if: ${{ matrix.shard == 1 }}
      # A prebuilt cargo-nextest, checked against its published checksum, in
      # seconds rather than the minutes building it would take.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      - if: ${{ runner.os == 'Windows' }}
        name: Build and provision the native Windows sandbox
        shell: pwsh
        run: |
          cargo build -p crucible-sandbox-broker --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\debug\crucible-sandbox-broker.exe --windows-sandbox-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # On Windows, a common initialized MSYS parent prevents concurrent Git
      # Bash children from racing while creating their shared mount table
      # (add_item EPERM). The documentation examples run beside the first part.
      - shell: bash
        run: |
          cargo nextest run --workspace --locked --no-fail-fast --partition hash:${{ matrix.shard }}/${{ matrix.shards }}
          if [[ ${{ matrix.shard }} == 1 ]]; then cargo test --workspace --locked --doc; fi
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      - if: ${{ runner.os == 'Windows' && always() }}
        name: Remove the native Windows sandbox setup
        shell: pwsh
        run: |
          if (Test-Path .\target\debug\crucible-sandbox-broker.exe) {
            & .\target\debug\crucible-sandbox-broker.exe --windows-sandbox-uninstall
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: ./.github/actions/check-clean-worktree

  platform-checks:
    name: ${{ matrix.name }} checks
    if: ${{ !inputs.docs-only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The same platforms as the tests above. A macOS cell runs the rollback
      # drill too, rather than queueing for a macOS machine of its own, so its
      # cache is kept apart: it also holds the build the drill makes.
      matrix:
        include: >-
          ${{ fromJSON(inputs.all-platforms && '[
          {"name": "macOS Intel", "os": "macos-15-intel", "drill": true},
          {"name": "macOS Apple silicon", "os": "macos-26", "drill": true},
          {"name": "Windows x86_64", "os": "windows-latest", "drill": false},
          {"name": "Windows ARM64", "os": "windows-11-arm", "drill": false}]' || '[
          {"name": "macOS Apple silicon", "os": "macos-26", "drill": true},
          {"name": "Windows x86_64", "os": "windows-latest", "drill": false}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.drill && 'checks-drill' || 'checks' }}-${{ matrix.os }}
      # First, so its steps meet the job as they would in the drill's own job,
      # and every check after it runs whatever it found.
      - if: ${{ matrix.drill }}
        uses: ./.github/actions/rollback-drill
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - if: ${{ runner.os != 'Windows' && !cancelled() }}
        run: scripts/sh/install-tests.sh
      # Both shells the Windows installer promises to run under.
      - if: ${{ runner.os == 'Windows' && !cancelled() }}
        name: Installer tests under Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ps1/install-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ps1/install-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/check-clean-worktree

  # FreeBSD's mv, ln, install, sync and checksum tools differ from both GNU and
  # macOS, and the installer depends on how each renames over a link. GitHub
  # hosts no FreeBSD runner, so the installer's tests run in the same guest the
  # release builds in. The update's activation renames over the same link and
  # shares the installer's lock, so its tests, which kill an update at each
  # point it changes the install and recover from what it left, run there
  # too. Unlike that release job, this one is required: it builds one crate's
  # tests rather than the release, so the guest is most of what it waits on.
  freebsd-installer:
    name: FreeBSD installer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOOTSTRAP_RUSTUP_VERSION: "1.29.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          prepare: pkg install -y bash curl
          # `--default-toolchain none` leaves the choice to
          # rust-toolchain.toml, so this guest compiles with the version every
          # other machine here does rather than whatever pkg happens to carry.
          # `set -e` so the installer's tests failing fails the job even when
          # the update's tests after them pass.
          run: |
            set -e
            rustup_sha256=c3fdfa4553e088edad701ea74776eb707644bed9f4a44f42a077e733201e966a
            url="https://static.rust-lang.org/rustup/archive/${{ env.BOOTSTRAP_RUSTUP_VERSION }}/x86_64-unknown-freebsd/rustup-init"
            curl --proto '=https' --tlsv1.2 --fail --location --silent \
              --show-error --output rustup-init "$url"
            if [ "$(sha256 -q rustup-init)" != "$rustup_sha256" ]; then
              echo 'rustup-init checksum did not match'
              exit 1
            fi
            chmod 755 rustup-init
            ./rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain none
            rm rustup-init
            . "$HOME/.cargo/env"

            scripts/sh/install-tests.sh
            cargo test -p crucible-update --locked

  # Windows ARM64 cannot be cross-built from Linux, so a pull request that
  # leaves its tests to dev still compiles every target there. It starts from
  # the cache the full run on dev saves.
  windows-arm64-build:
    name: Windows ARM64 build
    if: ${{ !inputs.all-platforms && !inputs.docs-only }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks-windows-11-arm
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: ./.github/actions/check-clean-worktree

  rollback-drill:
    name: Rollback drill (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The same platforms as the tests above, with Linux, less macOS, whose
      # drill runs in its checks job.
      matrix:
        include: >-
          ${{ fromJSON(inputs.all-platforms && '[
          {"name": "Linux", "os": "ubuntu-latest"},
          {"name": "Windows x86_64", "os": "windows-latest"},
          {"name": "Windows ARM64", "os": "windows-11-arm"}]' || inputs.docs-only && '[
          {"name": "Linux", "os": "ubuntu-latest"}]' || '[
          {"name": "Linux", "os": "ubuntu-latest"},
          {"name": "Windows x86_64", "os": "windows-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: ./.github/actions/rollback-drill
      # A check whose only value is as a check, like the drill's self-test.
      - uses: ./.github/actions/check-clean-worktree
        if: ${{ always() }}
