name: native-sandbox-experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-uid:
    name: macOS UID compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh .github/probes/macos-uid.sh
