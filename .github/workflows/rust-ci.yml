name: rust-ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The gate runs on the enforcing sandbox host, and a missing backend is
      # a failure rather than a skip; the action says why.
      - uses: ./.github/actions/enforcing-sandbox
      - run: scripts/sh/rust-checks.sh
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      - uses: ./.github/actions/check-clean-worktree

  platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple silicon
            os: macos-26
          - name: Windows x86_64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: ${{ runner.os == 'Windows' && !cancelled() }}
        name: Build and provision the native Windows sandbox
        shell: pwsh
        run: |
          cargo build -p crucible-sandbox-broker --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\debug\crucible-sandbox-broker.exe --windows-sandbox-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: ${{ runner.os == 'macOS' && !cancelled() }}
        run: cargo test --workspace --locked
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      - if: ${{ runner.os == 'Windows' && !cancelled() }}
        # A common initialized MSYS parent prevents concurrent Git Bash children
        # from racing while creating their shared mount table (add_item EPERM).
        shell: bash
        run: cargo test --workspace --locked
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1
      - if: ${{ runner.os != 'macOS' && runner.os != 'Windows' && !cancelled() }}
        run: cargo test --workspace --locked
      - if: ${{ !cancelled() }}
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - if: ${{ runner.os != 'Windows' && !cancelled() }}
        run: scripts/sh/install-tests.sh
      # Both shells the Windows installer promises to run under.
      - if: ${{ runner.os == 'Windows' && !cancelled() }}
        name: Installer tests under Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ps1/install-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ps1/install-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - if: ${{ runner.os == 'Windows' && always() }}
        name: Remove the native Windows sandbox setup
        shell: pwsh
        run: |
          if (Test-Path .\target\debug\crucible-sandbox-broker.exe) {
            & .\target\debug\crucible-sandbox-broker.exe --windows-sandbox-uninstall
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: ./.github/actions/check-clean-worktree

  rollback-drill:
    name: Rollback drill (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple silicon
            os: macos-26
          - name: Windows x86_64
            os: windows-latest
          - name: Windows ARM64
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The tag the drill rolls back to, read from the drill so it is named in
      # one place, and fetched without credentials. The drill itself never
      # fetches; it builds whatever tag is already local.
      - name: Fetch the previous release tag
        shell: bash
        run: |
          tag=$(sed -n 's/^readonly PRIOR_TAG=//p' scripts/sh/rollback-drill.sh)
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::scripts/sh/rollback-drill.sh names no PRIOR_TAG"
            exit 1
          }
          echo "PRIOR_TAG=$tag" >>"$GITHUB_ENV"
          # The runner image, since a binary built on a newer image may not
          # start on an older one while a label rolls between them.
          echo "PRIOR_IMAGE=${ImageOS:-unknown}" >>"$GITHUB_ENV"
          # A runner that loses github.com for a minute or so has not found a
          # broken drill, so the fetch is tried three times, with pauses.
          for pause in 30 60 ''; do
            git fetch --depth=1 origin tag "$tag" && break
            [[ -n $pause ]] || exit 1
            echo "::warning::could not fetch $tag; trying again in ${pause}s"
            sleep "$pause"
          done
      # The previous binary depends on nothing but the tag and the platform, so
      # it is restored from the cache once a run on `dev` has saved it.
      - name: Restore the previous release binary
        id: prior
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-bin
          key: rollback-prior-${{ runner.os }}-${{ env.PRIOR_IMAGE }}-${{ runner.arch }}-${{ env.PRIOR_TAG }}
      # Built in a worktree of this checkout so the candidate tree is untouched.
      # No sandbox setup: the drill runs the binaries headless with redirected
      # input and compares replay, pending-action recovery and read-only
      # commands — it starts no sandboxed command.
      - name: Build the previous release binary
        id: build-prior
        if: ${{ steps.prior.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/prior-src" "$PRIOR_TAG"
          # The tag built when it was released, and the crates it locks that
          # the cache lacks are downloaded here. A failure is nearly always the
          # registry out of reach for a minute, so it is tried three times too.
          for pause in 30 60 ''; do
            (cd "$RUNNER_TEMP/prior-src" && cargo build --locked --bin crucible) && break
            [[ -n $pause ]] || exit 1
            echo "::warning::could not build $PRIOR_TAG; trying again in ${pause}s"
            sleep "$pause"
          done
          mkdir -p "$RUNNER_TEMP/prior-bin"
          for name in crucible crucible.exe; do
            built="$RUNNER_TEMP/prior-src/target/debug/$name"
            if [[ -f $built ]]; then cp "$built" "$RUNNER_TEMP/prior-bin/"; fi
          done
          # An empty directory would be cached under a key no run replaces.
          [[ -n $(ls -A "$RUNNER_TEMP/prior-bin") ]] || {
            echo "::error::the build of $PRIOR_TAG left no crucible binary"
            exit 1
          }
      - name: Cache the previous release binary
        if: ${{ steps.prior.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/prior-bin
          key: ${{ steps.prior.outputs.cache-primary-key }}
      # The drill builds the candidate from this checkout itself, so no step
      # builds it beforehand, and the self-test's runs find it current.
      - name: Run the rollback drill
        shell: bash
        run: |
          prior="$RUNNER_TEMP/prior-bin/crucible"
          [[ -x $prior ]] || prior="$prior.exe"
          scripts/sh/rollback-drill.sh --prior-binary "$prior"
      # A second, independent gate, so it runs whatever the drill did. It is
      # handed the same previous binary, so the release is built once here
      # rather than again inside the self-test, and it waits for that binary:
      # when it was never built, the step that failed to build it says why.
      - name: Run the rollback drill self-test
        if: ${{ always() && (steps.prior.outputs.cache-hit == 'true' || steps.build-prior.outcome == 'success') }}
        shell: bash
        run: |
          prior="$RUNNER_TEMP/prior-bin/crucible"
          [[ -x $prior ]] || prior="$prior.exe"
          scripts/sh/rollback-drill-selftest.sh --prior-binary "$prior"
      - name: Remove the previous release worktree
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d $RUNNER_TEMP/prior-src ]]; then
            git worktree remove --force "$RUNNER_TEMP/prior-src"
          fi
      # A check whose only value is as a check, like the self-test above.
      - uses: ./.github/actions/check-clean-worktree
        if: ${{ always() }}
