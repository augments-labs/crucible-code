name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows-bootstrap:
    name: Windows final-token bootstrap v10
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: pwsh
      run: ./.github/probes/windows-bootstrap.ps1
  macos-mach:
    name: macOS inherited Mach capabilities (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - macos-15-intel
        - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: sh .github/probes/macos-mach.sh
