name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  macos-task-access-rpc:
    name: macOS task-access message policy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: bash
      run: sh .github/probes/macos-task-access-rpc.sh
