name: native-sandbox-experiment
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  windows-availability:
    name: Windows 11 ARM native primitive availability
    runs-on: windows-11-arm
    timeout-minutes: 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - shell: pwsh
      run: .github/probes/windows-native-availability.ps1
