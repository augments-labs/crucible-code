name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` and `unlabeled` are not in the default set, and without them
    # the one remedy this repository documents for an oversized pull request
    # does nothing: the size job has already run and failed by the time
    # somebody adds `moves-only` or `whole-module`, and nothing asks it again.
    # A rule whose exception only applies on the next push is not the rule
    # `CONTRIBUTING.md` describes.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A second push to the same branch makes the first run's answer stale, so
# stop paying for it. A label is the exception and gets a group of its own: it
# changes no file, so it makes nothing stale, and cancelling the run that is
# still building would turn a pull request red for having been labelled.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' || github.event.action == 'unlabeled' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # A ceiling, not a budget. Every number here is many times what the job
    # takes, because what it catches is a step that has stopped rather than one
    # that got slow — a package mirror that never answers, a runner that hangs
    # after the last line it printed. Without one, GitHub's own six-hour default
    # applies, and a job that will never finish reads as a job still going for
    # most of a working day. Slowness is the budgets' question and is measured
    # somewhere that can tell the difference.
    timeout-minutes: 15
    # Every job below this one reads the tree, and a label leaves the tree
    # exactly where it was. Only the job that reads the labels runs again.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain action. rustup ships on the runner and reads
      # rust-toolchain.toml, so the first cargo call installs exactly the
      # version and components a contributor has — one pin, not two.
      - run: scripts/check.sh

  size:
    name: 400 changed lines
    timeout-minutes: 5
    # The one rule that cannot live in scripts/check.sh, whose whole promise is
    # the same answer for the same tree. How large a change is asks about two
    # trees, and the second is whatever main has reached by now.
    #
    # It reports rather than blocks for now. The last line of the run step
    # below is where that is decided, and why.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the comparison. The default clone holds the head and
          # nothing to measure it against.
          fetch-depth: 0

      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Named for the message rather than for the verdict: the ceiling
          # blocks wherever a pull request is going. A branch collecting
          # sub-branches was once let past on the argument that the review that
          # matters happens when it asks for `main` — but that measures the
          # collection and never the pieces, so the reader of each piece, who is
          # the one the ceiling is for, met an unbounded diff either way.
          INTO: ${{ github.event.pull_request.base.ref }}
          # Code that only moves is the diff this measures wrongly, and no diff
          # can prove that about itself. The label is somebody saying so, and it
          # stays on the pull request where the next reader can see it was said.
          MOVED: ${{ contains(github.event.pull_request.labels.*.name, 'moves-only') }}
          # The other one, and it is the compiler that decides it rather than
          # the author: a module whose parts do not compile apart has a floor,
          # and where that floor is over the ceiling the only smaller pull
          # request is one that lands the code without the tests that prove it.
          # `-D warnings` is what sets it — an unreached function is a failed
          # build here, so a module arrives whole or not at all.
          WHOLE: ${{ contains(github.event.pull_request.labels.*.name, 'whole-module') }}
        run: |
          set -euo pipefail

          # Against the point the branch left its base rather than against the
          # base as it stands, or every commit merged since would be counted as
          # this pull request's.
          from=$(git merge-base "$BASE" "$HEAD")

          # Generated files are output. `Cargo.lock` moves by hundreds of lines
          # for a one-line manifest edit, and the schema is written by the
          # parser — neither is read a line at a time by anyone.
          changed=$(git diff --numstat "$from" "$HEAD" \
              -- . ':!Cargo.lock' ':!schema' |
              awk '{ added += $1; removed += $2 } END { print added + removed }')

          if ((changed <= 400)); then
              echo "$changed changed lines into $INTO"
              exit 0
          fi

          if [[ "$MOVED" == true ]]; then
              echo "$changed changed lines, labelled moves-only"
              exit 0
          fi

          if [[ "$WHOLE" == true ]]; then
              echo "$changed changed lines, labelled whole-module"
              exit 0
          fi

          echo "$changed changed lines into $INTO; the ceiling is 400"
          echo "split it into pull requests that each stand on their own,"
          echo "or label it moves-only if nothing changed but where it lives,"
          echo "or whole-module if its parts do not compile apart"

          # Counted and said, not sent back. The ceiling is off while the
          # project is this young and most of what arrives is a whole module,
          # which is the shape it measures worst — but the number is worth
          # having in front of whoever is about to read the diff either way, so
          # what is switched off is the verdict rather than the measurement.
          # Turning it back on is this line and nothing else.
          exit 0

  platforms:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # The gate above is the whole standard and runs once, because formatting,
    # the line-count cap and every grep over the tree answer the same on any
    # machine. What does not is the code that is split by platform — a session
    # log held private by an access control list rather than a mode, the shell
    # the bash tool resolves, where the home directory is. This job is what
    # executes that rather than merely compiling it.
    #
    # FreeBSD is not here. It builds in a virtual machine, which is minutes per
    # run, and it shares the Unix half of every split with the two runners that
    # are — the release workflow is where it gets its own build.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs even when clippy above did not, for the reason the gate job now
      # runs every one of its sections: this job exists to execute the
      # platform-split code, and a lint that stopped the run means nobody
      # learned whether that code works here — which is the one question this
      # runner was paid for. Both invocations are byte-for-byte what
      # `scripts/check.sh` runs, so the two stay one standard on three
      # platforms.
      - if: '!cancelled()'
        run: cargo test --workspace --locked

      # The installer ships for Unix and depends on each platform's tar and
      # checksum tools. Run its offline archive and rollback cases on macOS as
      # well as in the Linux gate; Windows uses the standalone executable.
      - if: runner.os != 'Windows' && !cancelled()
        run: scripts/install-tests.sh

  budgets:
    name: scripts/bench.sh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A shared runner is noisy, so the number here is a trend and an artifact,
    # not the release measurement — RELEASING.md still requires a quiet
    # machine. What this job defends is that the budgets stay measured at all,
    # which is why it blocks: `scripts/bench.sh` treats a budget with no probe
    # as a failure rather than a skip, so this job goes red both when the code
    # got slower and when a budget quietly stopped being checked.
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The grep budget is a ratio against the `rg` binary, so the binary has
      # to be here. A budget measured against something absent is not measured.
      #
      # Fetched and checksummed rather than installed, for two reasons. A
      # package manager hands over whichever version the distribution is
      # carrying this month, and a ratio whose denominator moves on somebody
      # else's release schedule reports our own speed changing when it has not.
      # And the mirror is a machine this repository does not own: it has hung
      # for tens of minutes at a stretch, on the step before the one that does
      # the measuring, which is a long way to travel to learn nothing.
      #
      # The version is the one a reader running the budgets on their own
      # machine will have, so the two numbers mean the same thing. Pinned by
      # digest as well as by version, like every action above.
      - name: The rg the grep budget is measured against
        env:
          RIPGREP_VERSION: 15.0.0
          RIPGREP_SHA256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
        run: |
          stem=ripgrep-$RIPGREP_VERSION-x86_64-unknown-linux-musl
          curl --proto '=https' --tlsv1.2 --fail --location --silent \
            --show-error --output rg.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RIPGREP_VERSION/$stem.tar.gz"
          printf '%s  rg.tar.gz\n' "$RIPGREP_SHA256" | sha256sum --check --strict -
          tar xzf rg.tar.gz "$stem/rg"
          sudo install -m 755 "$stem/rg" /usr/local/bin/rg
          rm -rf rg.tar.gz "$stem"
          rg --version | head -1

      - run: scripts/bench.sh > budgets.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `always()`, because a run that went over budget is the one worth
        # keeping.
        if: always()
        with:
          name: budgets
          path: budgets.json
