name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer stale, so
# stop paying for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain action. rustup ships on the runner and reads
      # rust-toolchain.toml, so the first cargo call installs exactly the
      # version and components a contributor has — one pin, not two.
      - run: scripts/check.sh

  size:
    name: 400 changed lines
    # The one rule that cannot live in scripts/check.sh, whose whole promise is
    # the same answer for the same tree. How large a change is asks about two
    # trees, and the second is whatever main has reached by now.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the comparison. The default clone holds the head and
          # nothing to measure it against.
          fetch-depth: 0

      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # Where it is going decides whether the ceiling blocks. `main`, `dev`
          # and a release branch are read by somebody other than the author and
          # are what a release is cut from. Anywhere else is a branch somebody
          # is assembling, and the review that matters happens when it asks for
          # one of these — measured then, over everything it collected.
          INTO: ${{ github.event.pull_request.base.ref }}
          # Code that only moves is the diff this measures wrongly, and no diff
          # can prove that about itself. The label is somebody saying so, and it
          # stays on the pull request where the next reader can see it was said.
          MOVED: ${{ contains(github.event.pull_request.labels.*.name, 'moves-only') }}
        run: |
          set -euo pipefail

          # Against the point the branch left its base rather than against the
          # base as it stands, or every commit merged since would be counted as
          # this pull request's.
          from=$(git merge-base "$BASE" "$HEAD")

          # Generated files are output. `Cargo.lock` moves by hundreds of lines
          # for a one-line manifest edit, and the schema is written by the
          # parser — neither is read a line at a time by anyone.
          changed=$(git diff --numstat "$from" "$HEAD" \
              -- . ':!Cargo.lock' ':!schema' |
              awk '{ added += $1; removed += $2 } END { print added + removed }')

          if ((changed <= 400)); then
              echo "$changed changed lines into $INTO"
              exit 0
          fi

          if [[ "$MOVED" == true ]]; then
              echo "$changed changed lines, labelled moves-only"
              exit 0
          fi

          case "$INTO" in
              main | dev | release/*)
                  echo "$changed changed lines into $INTO; the ceiling is 400"
                  echo "split it into pull requests that each stand on their own,"
                  echo "or label it moves-only if nothing changed but where it lives"
                  exit 1
                  ;;
          esac

          echo "$changed changed lines into $INTO, over the 400-line ceiling"
          echo "not blocked here — $INTO is measured in turn when it asks for main"

  platforms:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    # The gate above is the whole standard and runs once, because formatting,
    # the line-count cap and every grep over the tree answer the same on any
    # machine. What does not is the code that is split by platform — a session
    # log held private by an access control list rather than a mode, the shell
    # the bash tool resolves, where the home directory is. This job is what
    # executes that rather than merely compiling it.
    #
    # FreeBSD is not here. It builds in a virtual machine, which is minutes per
    # run, and it shares the Unix half of every split with the two runners that
    # are — the release workflow is where it gets its own build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Runs even when clippy above did not, for the reason the gate job now
      # runs every one of its sections: this job exists to execute the
      # platform-split code, and a lint that stopped the run means nobody
      # learned whether that code works here — which is the one question this
      # runner was paid for. Both invocations are byte-for-byte what
      # `scripts/check.sh` runs, so the two stay one standard on three
      # platforms.
      - if: '!cancelled()'
        run: cargo test --workspace --locked

  budgets:
    name: scripts/bench.sh
    runs-on: ubuntu-latest
    # A shared runner is noisy, so the number here is a trend and an artifact,
    # not the release measurement — RELEASING.md still requires a quiet
    # machine. What this job defends is that the budgets stay measured at all,
    # which is why it blocks: `scripts/bench.sh` treats a budget with no probe
    # as a failure rather than a skip, so this job goes red both when the code
    # got slower and when a budget quietly stopped being checked.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The grep budget is a ratio against the `rg` binary, so the binary has
      # to be here. A budget measured against something absent is not measured.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: scripts/bench.sh > budgets.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # `always()`, because a run that went over budget is the one worth
        # keeping.
        if: always()
        with:
          name: budgets
          path: budgets.json
