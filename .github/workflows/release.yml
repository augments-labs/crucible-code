name: release

# A release is two runs of this file, as RELEASING.md says. Dispatched on a
# ref, it stages: it builds every artifact, sums them once, and installs,
# upgrades and rolls back those exact bytes on every platform a cell covers,
# publishing nothing. Pushing the tag promotes: it finds the staging run of the
# tree the tag names, takes the bytes that run staged, and publishes them only
# where every digest matches. Nothing is rebuilt between the two, because a
# rebuild is a different binary from the one the cells installed. Nothing
# publishes on a branch, so a release is always a deliberate act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read for everything by default. Only one job here writes anything back, and
# the token every other job is handed is a token that cannot. That matters most
# in `freebsd-x86_64`: it checks the repository out and then hands that
# workspace to a third-party action running a virtual machine. Checkout does not
# persist the token, and least privilege is what keeps a
# future compromise of that action a failed build rather than a force-push.
permissions:
  contents: read

env:
  BOOTSTRAP_RUSTUP_VERSION: "1.29.0"

jobs:
  # Everything that can refuse a release happens once, here, before seven
  # machines spend a quarter of an hour building something that was never
  # going to ship.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      update-prior: ${{ steps.update.outputs.prior }}
      update-older: ${{ steps.update.outputs.older }}
      update-newer: ${{ steps.update.outputs.newer }}
      update-build-older: ${{ steps.update.outputs.build-older }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag that disagrees with the manifest ships a binary whose --version
      # lies. Catch it before anything is built. A staging run on a branch has
      # no tag to hold it to, so the manifest names the version every job below
      # packages, and the tag that promotes those bytes is held to it here.
      - name: The tag and the manifest agree
        id: version
        run: |
          manifest=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "crucible-code") | .version')
          if [[ $GITHUB_REF_TYPE == tag && "v$manifest" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $manifest"
            exit 1
          fi
          echo "version=$manifest" >>"$GITHUB_OUTPUT"

      # The three releases the update cells need. The older is the one they
      # install and the newer is the one `crucible update` takes it to; the
      # prior is the published release the rollback drill names, which they
      # install the older over. A run that stages a release newer than the
      # prior has the older already: it is the staged release, so only the
      # newer, one patch above it, is built. A run on a tree that still says
      # the prior's version, before the bump, stages nothing new, so both are
      # built: the next minor release and the patch after it. The build jobs
      # build them, and no release is named here.
      - name: The releases the update cells move between
        id: update
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # >>> update pair
          tag=$(sed -n 's/^readonly PRIOR_TAG=//p' scripts/sh/rollback-drill.sh)
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::scripts/sh/rollback-drill.sh names no PRIOR_TAG"
            exit 1
          fi
          prior=${tag#v}
          if [[ ! $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::the manifest version '$VERSION' is not a release version"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
          if [[ $VERSION == "$prior" ]]; then
            older=$major.$((minor + 1)).0
            build_older=true
          elif [[ $(printf '%s\n' "$prior" "$VERSION" | sort -V | tail -n 1) == "$VERSION" ]]; then
            older=$VERSION
            build_older=false
          else
            echo "::error::the manifest version $VERSION is older than PRIOR_TAG $tag"
            exit 1
          fi
          newer=${older%.*}.$((${older##*.} + 1))
          {
            echo "prior=$prior"
            echo "older=$older"
            echo "newer=$newer"
            echo "build-older=$build_older"
          } >>"$GITHUB_OUTPUT"
          echo "the update cells take $older to $newer, and install $older over the published $prior"
          # <<< update pair

      # Re-run the deterministic local aggregate on the same enforcing sandbox
      # host CI proved it on, so the sandbox tests run here rather than skip.
      # Blocking CI already checked dependency policy and performance before
      # this commit reached main. check.sh runs the suites through
      # cargo-nextest, the prebuilt one rust-ci.yml installs. Nothing here
      # restores a cache: a release is built from nothing another ref wrote.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.146
      - uses: ./.github/actions/enforcing-sandbox
      - run: scripts/sh/check.sh
        env:
          CRUCIBLE_TEST_REQUIRE_ENFORCING_SANDBOX: 1

      # The section's summary and comparison link, not its whole list; the
      # script says why and refuses a section it cannot write them from.
      - name: Release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/python/release-notes.py "$VERSION" >NOTES.md

      - name: Stage release metadata
        run: |
          mkdir release-metadata
          cp NOTES.md scripts/sh/install.sh scripts/sh/uninstall.sh scripts/ps1/install.ps1 release-metadata/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: release-metadata/
          if-no-files-found: error

  # Linux builds in a digest-pinned CentOS Stream 9 image. Its glibc is 2.34,
  # which turns the compatibility floor promised in the getting-started page
  # into a build input rather than a fact reported after publication. The image
  # is multi-architecture, so each artifact still builds and runs natively.
  #
  # A stream is not an archive: the registry keeps the `stream9` tag moving and
  # garbage-collects the manifest a digest used to name, so this pin rots on
  # somebody else's schedule rather than on a change here. When it does, every
  # Linux job fails to start with `manifest unknown` before a line of this
  # workflow runs. `scripts/sh/release-container.sh` asks the registry for the
  # digest, weekly from `release-canary.yml` and by hand before a tag, so the
  # rot is met there first. The repair is to resolve the tag again and paste the
  # new digest below:
  #
  #   curl -s 'https://quay.io/api/v1/repository/centos/centos/tag/?onlyActiveTags=true&specificTag=stream9'
  #
  # What it may not become is the bare tag: the floor above is a
  # promise about a build input, and an input that can change underneath a
  # rebuild is not one. The smoke step before `publish` measures the floor the
  # artifact actually carries and fails the release when it has moved, so a
  # digest that raises glibc blocks the release rather than shipping quietly.
  #
  # Each build job also builds the releases the update cells need, one or two
  # more release builds after its own, and its time limit allows for them.
  build-linux:
    name: ${{ matrix.stem }}
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    container:
      image: quay.io/centos/centos:stream9@sha256:33346f5fe280763eb78e85f968ad52bc2b2013369de85403f67e802db98ed243
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - stem: linux-x86_64
            target: x86_64-unknown-linux-gnu
            rustup_sha256: 4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10
            runner: ubuntu-22.04
          - stem: linux-aarch64
            target: aarch64-unknown-linux-gnu
            rustup_sha256: 9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792
            runner: ubuntu-24.04-arm
    steps:
      - name: Build tools
        run: dnf install -y binutils curl-minimal gcc git gzip tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain remains the exact one in rust-toolchain.toml. rustup is
      # only the installer here, because the base image deliberately carries no
      # compiler that could drift away from the other release jobs.
      - name: Rust toolchain
        run: |
          url="https://static.rust-lang.org/rustup/archive/$BOOTSTRAP_RUSTUP_VERSION/${{ matrix.target }}/rustup-init"
          curl --proto '=https' --tlsv1.2 --fail --location --silent \
            --show-error --output rustup-init "$url"
          printf '%s  rustup-init\n' '${{ matrix.rustup_sha256 }}' |
            sha256sum --check --strict -
          chmod 755 rustup-init
          ./rustup-init -y --no-modify-path --profile minimal \
            --default-toolchain none
          rm rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The broker is PID 1 of every confined command and is found beside the
      # executable, so Linux archives carry both.
      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p crucible-code -p crucible-sandbox-broker

      - name: It runs, and says the version the manifest claims
        run: |
          said=$(./target/${{ matrix.target }}/release/crucible --version)
          if [[ $said != "crucible $VERSION" ]]; then
            echo "--version said '$said', expected 'crucible $VERSION'"
            exit 1
          fi

      # Started anywhere but as PID 1 of a sandbox, the broker refuses with
      # status 125 and says nothing on stdout; anything else is the wrong binary.
      - name: The broker refuses to run outside a sandbox
        run: |
          status=0
          said=$(./target/${{ matrix.target }}/release/crucible-sandbox-broker) || status=$?
          if [[ $status != 125 || -n $said ]]; then
            echo "the broker exited $status and said '$said', expected 125 and nothing"
            exit 1
          fi

      - name: Package
        run: |
          name=crucible-$VERSION-${{ matrix.stem }}
          mkdir -p "$name"
          cp ./target/${{ matrix.target }}/release/crucible "$name/"
          cp ./target/${{ matrix.target }}/release/crucible-sandbox-broker "$name/"
          cp README.md LICENSE "$name/"
          cp scripts/sh/install.sh scripts/sh/uninstall.sh "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | awk '{ print $1 }' > "digest-${{ matrix.stem }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.stem }}
          path: |
            crucible-*.tar.gz
            digest-*
          if-no-files-found: error

      # The releases the update cells move between, built here once the staged
      # one is uploaded, by the command above and in this container. The
      # fixture says how, and why nothing it builds can reach a release.
      - name: The releases the update cells move between
        env:
          OLDER: ${{ needs.gate.outputs.update-older }}
          NEWER: ${{ needs.gate.outputs.update-newer }}
          BUILD_OLDER: ${{ needs.gate.outputs.update-build-older }}
        run: |
          versions=$NEWER
          if [[ $BUILD_OLDER == true ]]; then versions="$OLDER $NEWER"; fi
          for version in $versions; do
            bash tests/fixtures/installer/update-build.sh --version "$version" --stem ${{ matrix.stem }} \
              --target ${{ matrix.target }} --binaries 'crucible crucible-sandbox-broker' --out update -- \
              cargo build --release --locked --target ${{ matrix.target }} \
                -p crucible-code -p crucible-sandbox-broker
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-${{ matrix.stem }}
          path: update/
          if-no-files-found: error

  # One job per non-Linux target, and every runner here is the architecture it
  # builds for. A binary nobody could execute here is one whose first run would
  # otherwise happen on a user's machine.
  build:
    name: ${{ matrix.stem }}
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    strategy:
      # One target failing is not a reason to stop learning about the other
      # three. A release is cancelled by hand either way.
      fail-fast: false
      matrix:
        include:
          - stem: macos-aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
          - stem: macos-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
          - stem: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: .exe
          - stem: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            exe: .exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `--locked` makes dependency resolution reproduce the tag. Runner and
      # linker inputs are native platform inputs, so byte-for-byte reproducible
      # artifacts are not claimed here.
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} -p crucible-code -p crucible-sandbox-broker

      # Every supported confinement backend needs its matching broker beside
      # the application. Git Bash also packages the Windows targets.
      - name: Package
        shell: bash
        run: |
          name=crucible-$VERSION-${{ matrix.stem }}
          mkdir -p "$name"
          cp ./target/${{ matrix.target }}/release/crucible${{ matrix.exe }} "$name/"
          cp ./target/${{ matrix.target }}/release/crucible-sandbox-broker${{ matrix.exe }} "$name/"
          cp README.md LICENSE "$name/"
          cp scripts/sh/install.sh scripts/sh/uninstall.sh "$name/"
          tar czf "$name.tar.gz" "$name"

          # Windows gets the bare executable beside the archive. Unpacking a
          # tarball to reach one file is a step, and the machines that need
          # this one are the least likely to have a shell that does it.
          if [[ -n "${{ matrix.exe }}" ]]; then
            cp "./target/${{ matrix.target }}/release/crucible.exe" "$name.exe"
            cp "./target/${{ matrix.target }}/release/crucible-sandbox-broker.exe" \
              "crucible-sandbox-broker-$VERSION-${{ matrix.stem }}.exe"
          fi

      - name: Both packaged binaries run on their native platform
        shell: bash
        run: |
          name=crucible-$VERSION-${{ matrix.stem }}
          mkdir unpacked
          tar xzf "$name.tar.gz" -C unpacked
          said=$("./unpacked/$name/crucible${{ matrix.exe }}" --version)
          if [[ $said != "crucible $VERSION" ]]; then
            echo "--version said '$said', expected 'crucible $VERSION'"
            exit 1
          fi
          status=0
          said=$("./unpacked/$name/crucible-sandbox-broker${{ matrix.exe }}") || status=$?
          if [[ $status != 125 || -n $said ]]; then
            echo "packaged broker exited $status and said '$said', expected 125 and nothing"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.stem }}
          path: |
            crucible-*.tar.gz
            crucible-*.exe
          if-no-files-found: error

      # The releases the update cells move between, built here once the staged
      # one is uploaded, by the command above. Windows cells only check and
      # refuse, so they need the older alone, and nothing when it is the
      # staged release. The fixture says how, and why nothing it builds can
      # reach a release.
      - name: The releases the update cells move between
        id: update
        shell: bash
        env:
          OLDER: ${{ needs.gate.outputs.update-older }}
          NEWER: ${{ needs.gate.outputs.update-newer }}
          BUILD_OLDER: ${{ needs.gate.outputs.update-build-older }}
        run: |
          versions=$NEWER
          if [[ $BUILD_OLDER == true ]]; then versions="$OLDER $NEWER"; fi
          if [[ -n "${{ matrix.exe }}" ]]; then
            versions=
            if [[ $BUILD_OLDER == true ]]; then versions=$OLDER; fi
          fi
          for version in $versions; do
            bash tests/fixtures/installer/update-build.sh --version "$version" --stem ${{ matrix.stem }} \
              --target ${{ matrix.target }} --binaries 'crucible crucible-sandbox-broker' \
              --exe "${{ matrix.exe }}" --out update -- \
              cargo build --release --locked --target ${{ matrix.target }} -p crucible-code -p crucible-sandbox-broker
          done
          if [[ -n $versions ]]; then echo built=true >>"$GITHUB_OUTPUT"; fi

      - if: steps.update.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-${{ matrix.stem }}
          path: update/
          if-no-files-found: error

  # GitHub hosts no FreeBSD runner, so this one target builds inside a guest
  # rather than cross-compiled from Linux. It costs about a quarter of an hour,
  # and what it buys is the same thing the six above get for free: a binary
  # that ran on the system it is published for.
  #
  # There is no FreeBSD runner, so this builds inside a virtual machine an
  # action brings up on a Linux one, and everything that machine needs is
  # fetched on infrastructure nobody here can pin, bound or repair. It has hung
  # on that step for half an hour at a stretch. That used to make it the one
  # platform a release could ship without; it is not any more, because a
  # staged release is promoted only once a fresh install of every archive it
  # will carry has passed, and the FreeBSD archive is one of them. What a hang
  # costs now is a staging run dispatched again, which builds nothing that
  # was ever published.
  freebsd-x86_64:
    name: freebsd-x86_64
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          prepare: pkg install -y bash curl
          # `--default-toolchain none` leaves the choice to
          # rust-toolchain.toml, so this guest compiles with the version every
          # other machine here does rather than whatever pkg happens to carry.
          run: |
            rustup_sha256=c3fdfa4553e088edad701ea74776eb707644bed9f4a44f42a077e733201e966a
            url="https://static.rust-lang.org/rustup/archive/${{ env.BOOTSTRAP_RUSTUP_VERSION }}/x86_64-unknown-freebsd/rustup-init"
            curl --proto '=https' --tlsv1.2 --fail --location --silent \
              --show-error --output rustup-init "$url"
            if [ "$(sha256 -q rustup-init)" != "$rustup_sha256" ]; then
              echo 'rustup-init checksum did not match'
              exit 1
            fi
            chmod 755 rustup-init
            ./rustup-init -y --no-modify-path --profile minimal \
              --default-toolchain none
            rm rustup-init
            . "$HOME/.cargo/env"

            # FreeBSD's base tar and checksum implementations are distinct from
            # the GNU tools in the gate, so exercise archive type preflight and
            # replacement rollback in the guest that will ship the binary.
            scripts/sh/install-tests.sh

            cargo build --release --locked --target x86_64-unknown-freebsd

            # Written in by Actions before the guest is started. The guest gets
            # only the environment this action is asked to forward, and a
            # version that arrived empty would package an artifact named for no
            # version at all.
            version='${{ needs.gate.outputs.version }}'
            [ -n "$version" ] || { echo 'the gate named no version'; exit 1; }
            said=$(./target/x86_64-unknown-freebsd/release/crucible --version)
            if [ "$said" != "crucible $version" ]; then
              echo "--version said '$said', expected 'crucible $version'"
              exit 1
            fi

            name=crucible-$version-freebsd-x86_64
            mkdir -p "$name"
            cp ./target/x86_64-unknown-freebsd/release/crucible "$name/"
            cp README.md LICENSE "$name/"
            cp scripts/sh/install.sh scripts/sh/uninstall.sh "$name/"
            tar czf "$name.tar.gz" "$name"

            # The releases the update cells move between, built by the command
            # above in this guest. The fixture says how, and why nothing it
            # builds can reach a release.
            versions='${{ needs.gate.outputs.update-newer }}'
            if [ '${{ needs.gate.outputs.update-build-older }}' = true ]; then
              versions="${{ needs.gate.outputs.update-older }} $versions"
            fi
            for update in $versions; do
              bash tests/fixtures/installer/update-build.sh --version "$update" --stem freebsd-x86_64 \
                --target x86_64-unknown-freebsd --binaries crucible --out update -- \
                cargo build --release --locked --target x86_64-unknown-freebsd || exit 1
            done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freebsd-x86_64
          path: crucible-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-freebsd-x86_64
          path: update/
          if-no-files-found: error

  # The release archive, not a local rebuild, runs in the stripped sandbox
  # before publication. Its independently carried digest catches corruption in
  # the artifact handoff, and smoke.sh also enforces the glibc 2.34 ceiling.
  smoke-linux:
    name: smoke linux-x86_64 artifact
    needs: build-linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `bwrap` is what smoke.sh builds its sandbox with. Upstream publishes a
      # source tarball and nothing else, so unlike the `rg` above there is no
      # binary to pin and the package manager stays.
      #
      # What changes is how long it may wait. Left to itself apt will sit on an
      # unanswering mirror indefinitely, and it has: three release attempts in
      # one afternoon, half an hour at a time, on the step before the one doing
      # any work. A bounded connection that fails and is retried turns that into
      # a minute, and a mirror that is genuinely down into a job that says so.
      #
      # `update` refreshing every index the runner image carries is not the same
      # question as whether this job can install what it needs. The image ships
      # third-party sources this job never reads, and one of them answering with
      # a corrupt index is enough for `update` to exit non-zero and take the
      # smoke test with it, having measured nothing. So a refresh that reports
      # trouble is passed on rather than obeyed, and `install` is what decides:
      # it fails on a missing package, which is the failure worth having.
      - name: bubblewrap, for the sandbox the smoke test runs in
        env:
          APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
        run: |
          sudo apt-get $APT update || echo "apt-get update reported an error; the install below decides"
          sudo apt-get $APT install -y bubblewrap
          bwrap --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: artifact

      - name: Smoke the downloaded archive
        run: |
          archive=$(find artifact -maxdepth 1 -name 'crucible-*.tar.gz' -type f)
          digest=$(<artifact/digest-linux-x86_64)
          scripts/sh/smoke.sh --no-provider --checksum "$digest" "$archive"

  # Every probe carries its own limit and exits non-zero when it is over, so a
  # build that got slower turns this job red. Red on the run, not a blocked
  # release: the staging verdict deliberately does not wait for it — the note
  # above `staged` says why — so what a failure here buys is a reading somebody
  # goes to the staging run to see, before or after the tag.
  #
  # The numbers stay on the run rather than on the release. They are
  # shared-runner trend data, not the quiet-machine reading RELEASING.md
  # requires, and a reading nobody should compare against is worse sitting
  # beside the downloads than absent from them. The environment file says what
  # produced them, for whoever goes to the run to read the trend.
  # `ubuntu-latest`, and the label is the whole point: on `ubuntu-22.04` this
  # job ran `scripts/sh/bench.sh` for eighty-five minutes without finishing, twice,
  # while CI's identical invocation on `ubuntu-latest` takes under three. Same
  # script, same ripgrep, same inputs — only the image differed. Nothing here
  # diagnoses why; what it does is stop shipping a release behind a probe that
  # only hangs on the image nothing else uses.
  budgets:
    name: release budgets
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same binary, pinned the same way, as the job in performance.yml —
      # and it has to stay the same one, because the two report a ratio against
      # it and a ratio means nothing next to a ratio against something else.
      # Fetched rather than installed: a package manager hands over whichever
      # version the distribution carries this month, and the mirror it comes
      # from is a machine this repository does not own.
      - name: The rg the grep budget is measured against
        env:
          RIPGREP_VERSION: 15.0.0
          RIPGREP_SHA256: 253ad0fd5fef0d64cba56c70dccdacc1916d4ed70ad057cc525fcdb0c3bbd2a7
        run: |
          stem=ripgrep-$RIPGREP_VERSION-x86_64-unknown-linux-musl
          curl --proto '=https' --tlsv1.2 --fail --location --silent \
            --show-error --output rg.tar.gz \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RIPGREP_VERSION/$stem.tar.gz"
          printf '%s  rg.tar.gz\n' "$RIPGREP_SHA256" | sha256sum --check --strict -
          tar xzf rg.tar.gz "$stem/rg"
          sudo install -m 755 "$stem/rg" /usr/local/bin/rg
          rm -rf rg.tar.gz "$stem"
          rg --version | head -1

      # The same shared-runner limits as performance.yml, for the same runner.
      - run: mkdir -p generated/json && scripts/sh/bench.sh > generated/json/budgets.json
        env:
          CRUCIBLE_BENCH_RUNNER: shared

      - name: Measurement environment
        run: |
          mkdir -p generated/txt
          {
            echo 'measurement=shared-runner-trend'
            uname -a
            rustc -vV
            rg --version | head -1
            lscpu
          } > generated/txt/budget-environment.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-budgets
          path: |
            generated/json/budgets.json
            generated/txt/budget-environment.txt
          if-no-files-found: error

  # The bytes this run staged, named once. Every cell below installs only what
  # this file lists, as it lists it, and the tag that promotes them publishes
  # this file as the release's SHA256SUMS once every byte it names is found
  # unchanged.
  staged-checksums:
    name: staged checksums
    needs: [gate, build, build-linux, freebsd-x86_64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: run

      # One file rather than one `.sha256` per archive: a reader checking what
      # they downloaded wants a single line to look up, and `sha256sum -c`
      # takes the whole thing.
      - name: One checksum file for the release
        run: |
          shopt -s nullglob
          mkdir assets
          cp run/notes/* assets/
          for built in run/{linux,macos,windows,freebsd}-*/crucible-*; do cp "$built" assets/; done
          cd assets
          sha256sum crucible-* install.sh uninstall.sh install.ps1 | tee SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged-sums
          path: assets/SHA256SUMS
          if-no-files-found: error

  # The cells a release must pass before it can be promoted, each run on the
  # staged bytes rather than on a build of its own, and all at once: none of
  # them waits for another. Each checks what it installs against the staged
  # checksums first, and installs with the staged installer.
  #
  # Every install is under a fresh directory of the runner's temporary space,
  # with its own home and a workspace beside it rather than around it: the
  # broker is trusted only below directories no group can write, and never
  # inside the tree it is confining.
  stage-unix:
    name: staged ${{ matrix.stem }}
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      STEM: ${{ matrix.stem }}
      BACKEND: ${{ matrix.backend }}
    strategy:
      fail-fast: false
      # Linux upgrades and rolls back on both architectures' first platform,
      # since that is where the flat layouts of earlier releases were
      # installed; every archive with a sandbox backend gets a fresh install
      # that finds it.
      matrix:
        include:
          - { stem: linux-x86_64, runner: ubuntu-latest, backend: linux-bubblewrap, upgrades: true, rollback: true }
          - { stem: linux-aarch64, runner: ubuntu-24.04-arm, backend: linux-bubblewrap, upgrades: true, rollback: false }
          - { stem: macos-aarch64, runner: macos-latest, backend: macos-seatbelt, upgrades: false, rollback: false }
          - { stem: macos-x86_64, runner: macos-15-intel, backend: macos-seatbelt, upgrades: false, rollback: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Bubblewrap and user namespaces the Rust gate's sandbox tests
      # run with, so a Linux install finds the backend it would on a machine
      # set up as the documentation says.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/enforcing-sandbox

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.stem }}
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged

      - name: What this cell installs is what was staged
        working-directory: staged
        run: |
          sums=SHA256SUMS
          for name in "crucible-$VERSION-$STEM.tar.gz" install.sh uninstall.sh; do
            awk -v name="$name" '$2 == name' "$sums"
          done >mine
          if [[ $(wc -l <mine) -ne 3 ]]; then
            echo "::error::the staged checksums do not list everything this cell installs"
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum --check --strict mine
          else
            shasum -a 256 --check mine
          fi
          rm mine

      - name: A fresh install of the staged bytes
        run: |
          root=$(mktemp -d "$RUNNER_TEMP/fresh.XXXXXX")
          mkdir -p "$root/home/.crucible" "$root/ws"
          export HOME=$root/home CRUCIBLE_CODE_HOME=$root/home/.crucible
          printf '%s\n' '{"sandbox":{"enabled":true},"updates":{"check":"never"}}' >"$CRUCIBLE_CODE_HOME/config.json"
          bin=$root/bin
          sums=$PWD/staged/SHA256SUMS
          bash staged/install.sh --dir "$bin" --version "$VERSION" \
            --archive "$PWD/staged/crucible-$VERSION-$STEM.tar.gz" --checksums "$sums"
          for name in crucible cru; do
            said=$("$bin/$name" --version)
            if [[ $said != "crucible $VERSION" ]]; then
              echo "::error::$name --version said '$said', expected 'crucible $VERSION'"
              exit 1
            fi
          done
          status=0
          report=$(cd "$root/ws" && "$bin/crucible" --sandbox) || status=$?
          printf '%s\n' "$report"
          if [[ $status != 0 ]] || ! grep -q "^  backend   $BACKEND," <<<"$report"; then
            echo "::error::the staged install did not find its $BACKEND sandbox"
            exit 1
          fi
          bash staged/uninstall.sh --dir "$bin"
          left=$(ls -A "$bin")
          if [[ -n $left ]]; then
            echo "::error::the uninstall left $left"
            exit 1
          fi

      # The two layouts installs before the release unit had: each installed
      # flat by the installer of its own release, a session held open on it,
      # and the staged installer run underneath that session. The session must
      # still answer afterwards, and the install must be the staged one.
      - name: Upgrade flat installs with a process running
        if: matrix.upgrades
        env:
          GH_TOKEN: ${{ github.token }}
          FLAT_RELEASES: 0.45.3 0.43.0
        run: |
          for from in $FLAT_RELEASES; do
            echo "::group::a flat $from install, upgraded under a running session"
            root=$(mktemp -d "$RUNNER_TEMP/flat.XXXXXX")
            mkdir -p "$root/home/.crucible" "$root/ws" "$root/prior"
            gh release download "v$from" --repo "$GITHUB_REPOSITORY" --dir "$root/prior" \
              --pattern "crucible-$from-$STEM.tar.gz" --pattern SHA256SUMS
            export HOME=$root/home CRUCIBLE_CODE_HOME=$root/home/.crucible
            printf '%s\n' '{"sandbox":{"enabled":true},"updates":{"check":"never"}}' >"$CRUCIBLE_CODE_HOME/config.json"
            bin=$root/bin
            sums=$root/prior/SHA256SUMS
            bash "tests/fixtures/installer/install-$from.sh" --dir "$bin" --version "$from" \
              --archive "$root/prior/crucible-$from-$STEM.tar.gz" --checksums "$sums"
            if [[ ! -f $bin/crucible || -L $bin/crucible ]]; then
              echo "::error::the $from installer left no flat install"
              exit 1
            fi
            mkfifo "$root/held.in"
            (cd "$root/ws" && exec "$bin/crucible" <"$root/held.in" >"$root/held.out" 2>&1) &
            held=$!
            exec 3>"$root/held.in"
            # Bounded: a session that stops answering is the failure, and
            # waiting on it longer than a minute would only hide that.
            answered() {
              for _ in $(seq 60); do
                (($(grep -c "available: $BACKEND" "$root/held.out") >= $1)) && return 0
                kill -0 "$held" 2>/dev/null || break
                sleep 1
              done
              cat "$root/held.out"
              echo "::error::the session held on the flat $from install gave no sandbox report $1"
              return 1
            }
            printf '/sandbox\n' >&3
            answered 1
            sums=$PWD/staged/SHA256SUMS
            bash staged/install.sh --dir "$bin" --version "$VERSION" \
              --archive "$PWD/staged/crucible-$VERSION-$STEM.tar.gz" --checksums "$sums"
            printf '/sandbox\n' >&3
            answered 2
            exec 3>&-
            status=0
            wait "$held" || status=$?
            if [[ $status != 0 ]]; then
              cat "$root/held.out"
              echo "::error::the session started on the flat $from install exited $status"
              exit 1
            fi
            said=$("$bin/crucible" --version)
            if [[ $said != "crucible $VERSION" ]]; then
              echo "::error::after upgrading from $from, --version said '$said'"
              exit 1
            fi
            report=$(cd "$root/ws" && "$bin/crucible" --sandbox)
            printf '%s\n' "$report"
            if ! grep -q "^  backend   $BACKEND," <<<"$report"; then
              echo "::error::the install upgraded from $from did not find its $BACKEND sandbox"
              exit 1
            fi
            bash staged/uninstall.sh --dir "$bin"
            echo "::endgroup::"
          done

      # Back to the release the rollback drill names, with the staged
      # installer, after the staged release was installed over it. Then the
      # drill itself, with the staged binary as the candidate and the
      # rolled-back one as the prior, so what it proves is about these bytes.
      # No release is named here: the drill's PRIOR_TAG is the one to move.
      - name: Roll back to the release before
        if: matrix.rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # >>> rollback
          tag=$(sed -n 's/^readonly PRIOR_TAG=//p' scripts/sh/rollback-drill.sh)
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::scripts/sh/rollback-drill.sh names no PRIOR_TAG"
            exit 1
          fi
          prior=${tag#v}
          if [[ $prior == "$VERSION" ]]; then
            echo "::error::PRIOR_TAG is the release being staged; it should name the one before"
            exit 1
          fi
          root=$(mktemp -d "$RUNNER_TEMP/rollback.XXXXXX")
          mkdir -p "$root/home/.crucible" "$root/ws" "$root/prior"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$root/prior" \
            --pattern "crucible-$prior-$STEM.tar.gz" --pattern SHA256SUMS
          export HOME=$root/home CRUCIBLE_CODE_HOME=$root/home/.crucible
          printf '%s\n' '{"sandbox":{"enabled":true},"updates":{"check":"never"}}' >"$CRUCIBLE_CODE_HOME/config.json"
          bin=$root/bin
          install_release() {
            local release=$1 from=$2
            local sums=$from/SHA256SUMS
            bash staged/install.sh --dir "$bin" --version "$release" \
              --archive "$from/crucible-$release-$STEM.tar.gz" --checksums "$sums"
            said=$("$bin/crucible" --version)
            if [[ $said != "crucible $release" ]]; then
              echo "::error::after installing $release, --version said '$said'"
              exit 1
            fi
          }
          install_release "$prior" "$root/prior"
          install_release "$VERSION" "$PWD/staged"
          install_release "$prior" "$root/prior"
          scripts/sh/rollback-drill.sh \
            --candidate-binary "$bin/.crucible-install/releases/$VERSION/crucible" \
            --prior-binary "$bin/crucible"
          bash staged/uninstall.sh --dir "$bin"
          # <<< rollback

  # The FreeBSD archive, installed fresh in the same guest the installer's
  # tests run in. FreeBSD has no sandbox backend, so what this proves is that
  # the staged installer installs it, both names run and say the staged
  # version, and the uninstall takes it all back.
  stage-freebsd:
    name: staged freebsd-x86_64
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freebsd-x86_64
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged

      # Checked here, on the host, since the guest reads this same directory.
      - name: What this cell installs is what was staged
        working-directory: staged
        run: |
          sums=SHA256SUMS
          for name in "crucible-$VERSION-freebsd-x86_64.tar.gz" install.sh uninstall.sh; do
            awk -v name="$name" '$2 == name' "$sums"
          done >mine
          if [[ $(wc -l <mine) -ne 3 ]]; then
            echo "::error::the staged checksums do not list everything this cell installs"
            exit 1
          fi
          sha256sum --check --strict mine
          rm mine

      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          prepare: pkg install -y bash
          run: |
            set -e
            version='${{ needs.gate.outputs.version }}'
            [ -n "$version" ] || { echo 'the gate named no version'; exit 1; }
            root=$(mktemp -d /tmp/fresh.XXXXXX)
            export HOME="$root/home"
            mkdir -p "$HOME"
            bin=$root/bin
            sums=$PWD/staged/SHA256SUMS
            bash staged/install.sh --dir "$bin" --version "$version" \
              --archive "$PWD/staged/crucible-$version-freebsd-x86_64.tar.gz" --checksums "$sums"
            for name in crucible cru; do
              said=$("$bin/$name" --version)
              if [ "$said" != "crucible $version" ]; then
                echo "$name --version said '$said', expected 'crucible $version'"
                exit 1
              fi
            done
            bash staged/uninstall.sh --dir "$bin"
            left=$(ls -A "$bin")
            if [ -n "$left" ]; then
              echo "the uninstall left $left"
              exit 1
            fi

  # The Windows x86-64 release as a Windows user gets it: install.ps1 installs
  # the staged archive flat, both names say the staged version, a sandboxed
  # command runs, which it can only do through the broker the install put
  # beside crucible.exe, and the uninstall leaves the directory empty. The
  # command is asked for by a model answering on loopback, so nothing here
  # reaches a vendor.
  stage-windows:
    name: staged windows-x86_64
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      STEM: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged

      - name: What this cell installs is what was staged
        working-directory: staged
        shell: bash
        run: |
          sums=SHA256SUMS
          for name in "crucible-$VERSION-$STEM.tar.gz" install.ps1; do
            awk -v name="$name" '$2 == name' "$sums"
          done >mine
          if [[ $(wc -l <mine) -ne 2 ]]; then
            echo "::error::the staged checksums do not list everything this cell installs"
            exit 1
          fi
          sha256sum --check --strict mine
          rm mine

      - name: install.ps1 installs the staged bytes flat
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'staged-bin'
          $archive = Join-Path $PWD "staged/crucible-$env:VERSION-$env:STEM.tar.gz"
          $sums = Join-Path $PWD 'staged/SHA256SUMS'
          pwsh -NoProfile -ExecutionPolicy Bypass -File staged/install.ps1 -Version $env:VERSION -Archive $archive -Checksums $sums -Dir $bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "STAGED_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($name in 'crucible.exe', 'crucible-sandbox-broker.exe', 'cru.exe') {
            if (-not (Test-Path -LiteralPath (Join-Path $bin $name) -PathType Leaf)) {
              Write-Output "::error::install.ps1 left no $name in $bin"
              exit 1
            }
          }
          foreach ($name in 'crucible.exe', 'cru.exe') {
            $said = & (Join-Path $bin $name) --version
            if ($LASTEXITCODE -ne 0 -or $said -ne "crucible $env:VERSION") {
              Write-Output "::error::$name --version said '$said', expected 'crucible $env:VERSION'"
              exit 1
            }
          }

      # The runner is elevated, so the setup the sandboxing guide asks an
      # administrator for runs here as the installed crucible.exe does it.
      - name: The installed crucible sets up its sandbox
        shell: pwsh
        run: |
          & (Join-Path $env:STAGED_BIN 'crucible.exe') sandbox setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: A sandboxed command runs through the staged broker
        shell: bash
        run: |
          # Paths are this shell's own, and converted with cygpath for each
          # Windows program handed one, rather than left to Git Bash to guess.
          root=$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/command.XXXXXX")
          mkdir -p "$root/home" "$root/ws"
          # A model that asks for one command, then reads what it returned.
          python - "$(cygpath -w "$root/port")" "$(cygpath -w "$root/result")" <<'PY' &
          import http.server, json, sys
          MARK = "staged-sandbox-ok"
          def stream(blocks, stop):
              events = [{"type": "message_start", "message": {"id": "m", "usage": {"input_tokens": 1, "output_tokens": 0}}}]
              for index, block in enumerate(blocks):
                  if block["type"] == "tool_use":
                      events.append({"type": "content_block_start", "index": index, "content_block": dict(block, input={})})
                      events.append({"type": "content_block_delta", "index": index,
                                     "delta": {"type": "input_json_delta", "partial_json": json.dumps(block["input"])}})
                  else:
                      events.append({"type": "content_block_start", "index": index, "content_block": block})
                  events.append({"type": "content_block_stop", "index": index})
              events.append({"type": "message_delta", "delta": {"stop_reason": stop}, "usage": {"output_tokens": 1}})
              events.append({"type": "message_stop"})
              return "".join(f"event: {e['type']}\ndata: {json.dumps(e)}\n\n" for e in events).encode()
          class Model(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers["content-length"])))
                  results = [part for message in body.get("messages", []) if isinstance(message.get("content"), list)
                             for part in message["content"] if part.get("type") == "tool_result"]
                  if results:
                      with open(sys.argv[2], "w") as kept:
                          json.dump(results[-1], kept)
                      answer = stream([{"type": "text", "text": "done"}], "end_turn")
                  else:
                      answer = stream([{"type": "tool_use", "id": "call-1", "name": "bash",
                                        "input": {"command": f"echo {MARK}"}}], "tool_use")
                  self.send_response(200)
                  self.send_header("content-type", "text/event-stream")
                  self.send_header("content-length", str(len(answer)))
                  self.end_headers()
                  self.wfile.write(answer)
              def log_message(self, *args):
                  pass
          server = http.server.HTTPServer(("127.0.0.1", 0), Model)
          with open(sys.argv[1], "w") as port:
              port.write(str(server.server_address[1]))
          server.serve_forever()
          PY
          model=$!
          for _ in $(seq 30); do [[ -s $root/port ]] && break; sleep 1; done
          if [[ ! -s $root/port ]]; then
            echo "::error::the loopback model never started"
            exit 1
          fi
          printf '{"provider":"anthropic","providers":{"anthropic":{"baseUrl":"http://127.0.0.1:%s/v1/messages","model":"claude-staging"}},"sandbox":{"enabled":true},"permissions":{"allow":["bash(echo staged-sandbox-ok)"]},"updates":{"check":"never"}}\n' \
            "$(<"$root/port")" >"$root/home/config.json"
          bin=$(cygpath -u "$STAGED_BIN")
          status=0
          (cd "$root/ws" && printf 'run it\n' |
            CRUCIBLE_CODE_HOME=$(cygpath -w "$root/home") ANTHROPIC_API_KEY=loopback-only \
            timeout 300 "$bin/crucible.exe") || status=$?
          kill "$model"
          if [[ $status != 0 || ! -s $root/result ]]; then
            echo "::error::the staged crucible.exe exited $status, and no result of its command came back"
            exit 1
          fi
          python - "$(cygpath -w "$root/result")" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print(json.dumps(result))
          if result.get("content") != "staged-sandbox-ok" or result.get("is_error"):
              print("::error::the sandboxed command did not run through the staged broker")
              sys.exit(1)
          PY

      # Always, once something was installed: the sandbox account and firewall
      # rules setup made, then the three files install.ps1 wrote, and nothing
      # may be left behind them.
      - name: The uninstall leaves nothing
        if: always() && env.STAGED_BIN != ''
        shell: pwsh
        run: |
          & (Join-Path $env:STAGED_BIN 'crucible.exe') sandbox uninstall
          $status = $LASTEXITCODE
          foreach ($name in 'crucible.exe', 'crucible-sandbox-broker.exe', 'cru.exe') {
            Remove-Item -LiteralPath (Join-Path $env:STAGED_BIN $name) -Force -ErrorAction SilentlyContinue
          }
          $left = @(Get-ChildItem -LiteralPath $env:STAGED_BIN -Force)
          if ($left.Count -ne 0) {
            Write-Output "::error::the uninstall left $($left.Name -join ', ')"
            exit 1
          }
          if ($status -ne 0) { exit $status }

  # `crucible update` on every platform install.sh installs. The gate names
  # three releases: an older one these cells install, a newer one `crucible
  # update` takes it to, and the published prior they install the older over.
  # The older is the staged release whenever this run stages one newer than
  # the prior, and the build jobs built everything else. A release source on
  # loopback serves the newer one, so nothing here is fetched from a release
  # but the prior. tests/fixtures/installer/update-cells.sh runs the cells
  # and says what each one proves.
  stage-update-unix:
    name: staged update ${{ matrix.stem }}
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      STEM: ${{ matrix.stem }}
      PRIOR: ${{ needs.gate.outputs.update-prior }}
      OLDER: ${{ needs.gate.outputs.update-older }}
      NEWER: ${{ needs.gate.outputs.update-newer }}
      BUILD_OLDER: ${{ needs.gate.outputs.update-build-older }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stem: linux-x86_64, runner: ubuntu-latest, backend: linux-bubblewrap }
          - { stem: linux-aarch64, runner: ubuntu-24.04-arm, backend: linux-bubblewrap }
          - { stem: macos-aarch64, runner: macos-latest, backend: macos-seatbelt }
          - { stem: macos-x86_64, runner: macos-15-intel, backend: macos-seatbelt }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        uses: ./.github/actions/enforcing-sandbox

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.stem }}
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-${{ matrix.stem }}
          path: update

      # The installer is always the staged one, and so is the older release
      # whenever the gate says it was not built.
      - name: What these cells take from the staged bytes is what was staged
        working-directory: staged
        run: |
          names=(install.sh)
          if [[ $BUILD_OLDER != true ]]; then names+=("crucible-$VERSION-$STEM.tar.gz"); fi
          for name in "${names[@]}"; do
            awk -v name="$name" '$2 == name' SHA256SUMS
          done >mine
          if [[ $(wc -l <mine) -ne ${#names[@]} ]]; then
            echo "::error::the staged checksums do not list everything these cells install"
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum --check --strict mine
          else
            shasum -a 256 --check mine
          fi
          rm mine

      - name: The release the cells start from, and the published one before it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir older prior
          if [[ $BUILD_OLDER == true ]]; then
            cp "update/$OLDER/crucible-$OLDER-$STEM.tar.gz" "update/$OLDER/SHA256SUMS" older/
          else
            cp "staged/crucible-$OLDER-$STEM.tar.gz" staged/SHA256SUMS older/
          fi
          gh release download "v$PRIOR" --repo "$GITHUB_REPOSITORY" --dir prior \
            --pattern "crucible-$PRIOR-$STEM.tar.gz" --pattern SHA256SUMS --pattern install.sh
          cd prior
          for name in "crucible-$PRIOR-$STEM.tar.gz" install.sh; do
            awk -v name="$name" '$2 == name' SHA256SUMS
          done >mine
          if [[ $(wc -l <mine) -ne 2 ]]; then
            echo "::error::v$PRIOR's checksums do not list what these cells install from it"
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum --check --strict mine
          else
            shasum -a 256 --check mine
          fi
          rm mine

      - name: crucible update is refused, applied, and installed over
        run: |
          bash tests/fixtures/installer/update-cells.sh --stem "$STEM" --backend ${{ matrix.backend }} \
            --installer staged/install.sh --older "$OLDER" \
            --older-archive "$PWD/older/crucible-$OLDER-$STEM.tar.gz" --older-sums "$PWD/older/SHA256SUMS" \
            --newer "$NEWER" --newer-dir "$PWD/update/$NEWER" --prior "$PRIOR" --prior-dir "$PWD/prior" \
            --scratch "$(mktemp -d "$RUNNER_TEMP/update.XXXXXX")"

  # The same cells in the FreeBSD guest. FreeBSD has no sandbox backend, so
  # each cell there runs without its sandboxed command, which is the one
  # thing it leaves out.
  stage-update-freebsd:
    name: staged update freebsd-x86_64
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      STEM: freebsd-x86_64
      PRIOR: ${{ needs.gate.outputs.update-prior }}
      OLDER: ${{ needs.gate.outputs.update-older }}
      BUILD_OLDER: ${{ needs.gate.outputs.update-build-older }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: freebsd-x86_64
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-freebsd-x86_64
          path: update

      # Checked here, on the host, since the guest reads this same directory.
      - name: What these cells take from the staged bytes is what was staged
        working-directory: staged
        run: |
          names=(install.sh)
          if [[ $BUILD_OLDER != true ]]; then names+=("crucible-$VERSION-$STEM.tar.gz"); fi
          for name in "${names[@]}"; do
            awk -v name="$name" '$2 == name' SHA256SUMS
          done >mine
          if [[ $(wc -l <mine) -ne ${#names[@]} ]]; then
            echo "::error::the staged checksums do not list everything these cells install"
            exit 1
          fi
          sha256sum --check --strict mine
          rm mine

      - name: The release the cells start from, and the published one before it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir older prior
          if [[ $BUILD_OLDER == true ]]; then
            cp "update/$OLDER/crucible-$OLDER-$STEM.tar.gz" "update/$OLDER/SHA256SUMS" older/
          else
            cp "staged/crucible-$OLDER-$STEM.tar.gz" staged/SHA256SUMS older/
          fi
          gh release download "v$PRIOR" --repo "$GITHUB_REPOSITORY" --dir prior \
            --pattern "crucible-$PRIOR-$STEM.tar.gz" --pattern SHA256SUMS --pattern install.sh
          cd prior
          for name in "crucible-$PRIOR-$STEM.tar.gz" install.sh; do
            awk -v name="$name" '$2 == name' SHA256SUMS
          done >mine
          if [[ $(wc -l <mine) -ne 2 ]]; then
            echo "::error::v$PRIOR's checksums do not list what these cells install from it"
            exit 1
          fi
          sha256sum --check --strict mine
          rm mine

      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "14.4"
          usesh: true
          prepare: pkg install -y bash python3
          run: |
            set -e
            older='${{ needs.gate.outputs.update-older }}'
            newer='${{ needs.gate.outputs.update-newer }}'
            prior='${{ needs.gate.outputs.update-prior }}'
            [ -n "$older" ] && [ -n "$newer" ] && [ -n "$prior" ] || { echo 'the gate named no update releases'; exit 1; }
            bash tests/fixtures/installer/update-cells.sh --stem freebsd-x86_64 --backend none \
              --installer staged/install.sh --older "$older" \
              --older-archive "$PWD/older/crucible-$older-freebsd-x86_64.tar.gz" --older-sums "$PWD/older/SHA256SUMS" \
              --newer "$newer" --newer-dir "$PWD/update/$newer" --prior "$prior" --prior-dir "$PWD/prior" \
              --scratch "$(mktemp -d /tmp/update.XXXXXX)"

  # `crucible update` on both Windows architectures, from a flat install.ps1
  # made of the older release. It answers `--check` from the release source
  # on loopback, exiting 3 to say the newer one is out, and refuses to apply
  # it with exit 1, naming install.ps1, with no file in the install changed.
  stage-update-windows:
    name: staged update ${{ matrix.stem }}
    needs: [gate, staged-checksums]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      STEM: ${{ matrix.stem }}
      OLDER: ${{ needs.gate.outputs.update-older }}
      NEWER: ${{ needs.gate.outputs.update-newer }}
      BUILD_OLDER: ${{ needs.gate.outputs.update-build-older }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stem: windows-x86_64, runner: windows-latest }
          - { stem: windows-aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.stem }}
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notes
          path: staged
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged
      - if: needs.gate.outputs.update-build-older == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: update-${{ matrix.stem }}
          path: update

      - name: What this cell takes from the staged bytes is what was staged
        working-directory: staged
        shell: bash
        run: |
          names=(install.ps1)
          if [[ $BUILD_OLDER != true ]]; then names+=("crucible-$VERSION-$STEM.tar.gz"); fi
          for name in "${names[@]}"; do
            awk -v name="$name" '$2 == name' SHA256SUMS
          done >mine
          if [[ $(wc -l <mine) -ne ${#names[@]} ]]; then
            echo "::error::the staged checksums do not list everything this cell installs"
            exit 1
          fi
          sha256sum --check --strict mine
          rm mine

      - name: The release the cell starts from
        shell: bash
        run: |
          mkdir older
          if [[ $BUILD_OLDER == true ]]; then
            cp "update/$OLDER/crucible-$OLDER-$STEM.tar.gz" "update/$OLDER/SHA256SUMS" older/
          else
            cp "staged/crucible-$OLDER-$STEM.tar.gz" staged/SHA256SUMS older/
          fi

      - name: install.ps1 installs the older release flat
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'update-bin'
          $archive = Join-Path $PWD "older/crucible-$env:OLDER-$env:STEM.tar.gz"
          $sums = Join-Path $PWD 'older/SHA256SUMS'
          pwsh -NoProfile -ExecutionPolicy Bypass -File staged/install.ps1 -Version $env:OLDER -Archive $archive -Checksums $sums -Dir $bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "UPDATE_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: crucible update checks, and refuses to apply
        shell: bash
        run: |
          python --version || { echo "::error::this runner has no python for the release source"; exit 1; }
          root=$(mktemp -d "$(cygpath -u "$RUNNER_TEMP")/update.XXXXXX")
          mkdir -p "$root/home" "$root/served"
          printf '%s\n' '{"updates":{"check":"never"}}' >"$root/home/config.json"
          # The newer release is named and nothing of it is served: a check
          # asks for no more, and an apply that asked for more is the failure.
          python -I tests/fixtures/installer/release-source.py "$(cygpath -w "$root/port")" \
            "$(cygpath -w "$root/heard")" "$NEWER" "$(cygpath -w "$root/served")" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 30); do [[ -s $root/port ]] && break; sleep 1; done
          if [[ ! -s $root/port ]]; then
            echo "::error::the release source never started"
            exit 1
          fi
          bin=$(cygpath -u "$UPDATE_BIN")
          listing() { (cd "$bin" && find . -type f -exec sha256sum {} + | LC_ALL=C sort); }
          update() {
            status=0
            CRUCIBLE_CODE_HOME=$(cygpath -w "$root/home") CRUCIBLE_CODE_UPDATE_SOURCE=http://127.0.0.1:$(<"$root/port") \
              "$bin/crucible.exe" update "$@" </dev/null >"$root/out" 2>"$root/err" || status=$?
            printf 'crucible update %s exited %s\n  stdout: %s\n  stderr: %s\n' "$*" "$status" "$(<"$root/out")" "$(<"$root/err")"
          }
          before=$(listing)
          update --check
          if [[ $status != 3 || $(<"$root/out") != "crucible $NEWER is out; this is $OLDER. \`crucible update\` installs it" ]]; then
            echo "::error::crucible update --check did not say that $NEWER is out"
            exit 1
          fi
          update
          if [[ $status != 1 ]] || ! grep -q 'install\.ps1' "$root/err"; then
            echo "::error::crucible update was not refused with a message naming install.ps1"
            exit 1
          fi
          if [[ $(listing) != "$before" ]]; then
            echo "::error::the refused update changed a file in $UPDATE_BIN"
            exit 1
          fi
          heard=$(<"$root/heard")
          printf 'the release source heard:\n%s\n' "$heard"
          if grep -qv '^GET /releases/latest ' "$root/heard"; then
            echo "::error::the release source was asked for more than which release is newest"
            exit 1
          fi

  # The verdict a tag is promoted on, and the only record that one may be.
  # Every cell above is in its `needs`, it runs whatever they did, and the one
  # thing it keeps, the staged checksums under the name `staged`, is uploaded
  # only after every one of them passed. A stage that failed, was skipped or was
  # cancelled leaves no `staged` artifact, so there is nothing for a tag to
  # promote and a dispatch again is the only way on. Any action in the run can
  # upload an artifact by that name too, so `publish` takes it only from a run
  # whose one job named `staged`, this one, concluded success.
  #
  # `budgets` is deliberately not among these. It is the slowest job here — the
  # grep probe alone runs twenty paired rounds across three workloads — and by
  # its own note above its numbers never reach the release: they are
  # shared-runner trend data, kept on the run for whoever goes looking. A
  # measurement that contributes nothing to the download should not stand
  # between a green build and the download.
  #
  # What that gives up, said plainly: a blown budget does not block a release.
  # The reading that decides that question is the quiet-machine one
  # `RELEASING.md` requires before the tag exists, and a shared runner's numbers
  # were never fit to overrule it — a red here still fails the staging run and
  # is still there to be read before the tag.
  #
  # `smoke-linux` is off the list for now. The job still runs and a red is still
  # on the run to be read; the verdict does not wait on it. Restoring the block
  # is putting the name back in `needs`.
  staged:
    name: staged
    needs: [gate, staged-checksums, stage-unix, stage-freebsd, stage-windows, stage-update-unix, stage-update-freebsd, stage-update-windows]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required cell passed on the staged bytes
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # >>> staged verdict
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ.get("NEEDS") or "{}")
          unpassed = sorted(job for job, outcome in needs.items() if outcome.get("result") != "success")
          if not needs or unpassed:
              print("::error::nothing staged here may be promoted; not passed: " + (", ".join(unpassed) or "no cell reported"))
              sys.exit(1)
          print("passed on the staged bytes: " + ", ".join(sorted(needs)))
          PY
          # <<< staged verdict

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staged-sums
          path: staged

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staged
          path: staged/SHA256SUMS
          if-no-files-found: error

  # The tag promotes; it builds nothing. It finds the staging run of the tree
  # the tag names, takes that run's artifacts, and publishes them only once
  # every byte matches the checksums its cells passed on. The release is
  # created as a draft with everything attached, downloaded back and held to
  # those checksums again, and only then made public, so there is never a
  # window where it is public, half the platforms are missing, or a byte
  # differs from the one that was installed.
  #
  # The gate runs again here because it is what holds the tag to the manifest
  # and the tree to the repository's checks, and both are about this push.
  publish:
    needs: gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # finds the staging run and downloads what it staged
      contents: write # creates the GitHub Release and uploads the archives
      id-token: write # signs the artifact attestation
      attestations: write
      artifact-metadata: write
    env:
      STAGED_SUMS: ${{ github.workspace }}/run/staged/SHA256SUMS
    steps:
      # The newest dispatched run of release.yml, in this repository, whose
      # commit has the tagged commit's tree, which has finished, which kept
      # one `staged` artifact, and whose one `staged` job concluded success
      # with that artifact made and last changed while it ran.
      # The tree rather than the commit, so a staging run of the release
      # branch promotes once its merge leaves the tree unchanged. No such run
      # is a refusal, never a rebuild.
      - name: The staging run of this tree
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # >>> staging run
          python3 - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime
          repo = os.environ["GITHUB_REPOSITORY"]
          def api(path):
              answer = subprocess.run(["gh", "api", path], capture_output=True, text=True)
              if answer.returncode != 0:
                  print(f"::error::gh api {path} failed: {answer.stderr.strip()}")
                  sys.exit(1)
              return json.loads(answer.stdout)
          # A time GitHub reported, or None when it is missing, unreadable or
          # has no offset to compare it by, which every caller refuses. GitHub
          # writes UTC as a trailing `Z`, which Python reads from 3.11; an
          # older one refuses every run rather than guess.
          def moment(value):
              try:
                  parsed = datetime.fromisoformat(value)
              except (TypeError, ValueError):
                  return None
              return parsed if parsed.tzinfo is not None else None
          trees = {}
          def tree(commit):
              if commit not in trees:
                  trees[commit] = api(f"repos/{repo}/git/commits/{commit}")["tree"]["sha"]
              return trees[commit]
          wanted = tree(os.environ["GITHUB_SHA"])
          runs = api(f"repos/{repo}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=100")
          for run in runs["workflow_runs"]:
              if run["event"] != "workflow_dispatch" or run["head_repository"]["full_name"] != repo:
                  continue
              if tree(run["head_sha"]) != wanted:
                  continue
              kept = api(f"repos/{repo}/actions/runs/{run['id']}/artifacts?name=staged")["artifacts"]
              staged = [artifact for artifact in kept if artifact["name"] == "staged" and not artifact["expired"]]
              if not staged:
                  continue
              if len(staged) != 1:
                  print(f"::warning::run {run['id']} kept {len(staged)} staged artifacts; not promoting it")
                  continue
              # A job that is not among the verdict's needs can still be running
              # after it, so only a run that has finished is read; what a re-run
              # uploads falls outside the window below.
              if run.get("status") != "completed":
                  print(f"::warning::run {run['id']} has not finished; not promoting it")
                  continue
              # Any action in the run could have uploaded an artifact by that
              # name, so it counts only beside the run's one `staged` job,
              # concluded success, and only when it was made and last changed
              # while that job ran. A run has about thirty jobs and one page
              # holds a hundred; a run that does not fit is refused, not half read.
              jobs = api(f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              if jobs["total_count"] > len(jobs["jobs"]):
                  print(f"::warning::run {run['id']} has more jobs than one page holds; not promoting it")
                  continue
              verdicts = [job for job in jobs["jobs"] if job["name"] == "staged"]
              concluded = [job.get("conclusion") for job in verdicts]
              if concluded != ["success"]:
                  print(f"::warning::run {run['id']} kept a staged artifact, but its staged jobs "
                        f"concluded {concluded or 'nothing'}; not promoting it")
                  continue
              began, ended = (moment(verdicts[0].get(key)) for key in ("started_at", "completed_at"))
              made = [moment(staged[0].get(key)) for key in ("created_at", "updated_at")]
              if began is None or ended is None or not all(at is not None and began <= at <= ended for at in made):
                  print(f"::warning::run {run['id']} kept a staged artifact its staged job cannot be shown "
                        "to have made; not promoting it")
                  continue
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"run={run['id']}\n")
              print(f"promoting what run {run['id']} staged: {run['html_url']}")
              sys.exit(0)
          print(f"::error::no staging run of tree {wanted} passed its cells; dispatch release.yml "
                "on this commit, wait for that run to finish, then re-run this one")
          sys.exit(1)
          PY
          # <<< staging run

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.stage.outputs.run }}
          github-token: ${{ github.token }}
          path: run

      - name: The release, as it was staged
        run: |
          shopt -s nullglob
          mkdir assets
          cp run/notes/* assets/
          for built in run/{linux,macos,windows,freebsd}-*/crucible-*; do cp "$built" assets/; done

      # The upload below is a glob, and a glob ships whatever is there, so what
      # must be present is written out and counted rather than trusted to a
      # wildcard: seven archives and four executables.
      - name: Every platform this release promises is here
        working-directory: assets
        run: |
          version=${GITHUB_REF_NAME#v}
          missing=
          for stem in linux-x86_64 linux-aarch64 macos-aarch64 macos-x86_64 \
                      windows-x86_64 windows-aarch64 freebsd-x86_64; do
            [ -f "crucible-$version-$stem.tar.gz" ] || missing="$missing $stem"
          done
          for stem in windows-x86_64 windows-aarch64; do
            [ -f "crucible-$version-$stem.exe" ] || missing="$missing $stem.exe"
            [ -f "crucible-sandbox-broker-$version-$stem.exe" ] || missing="$missing $stem-broker.exe"
          done
          if [ -n "$missing" ]; then
            echo "::error::required platforms missing:$missing"
            exit 1
          fi
          ls -1 crucible-*

      # The checksums the cells passed on are the release's, so they are
      # published as they were staged rather than computed again here: every
      # file to publish must be one they list, every file they list must be
      # here, and every byte must match.
      - name: Every byte to publish is a byte that was staged
        working-directory: assets
        run: |
          # >>> promote by digest
          published=(crucible-* install.sh uninstall.sh install.ps1)
          here=$(printf '%s\n' "${published[@]}" | sort)
          listed=$(awk '{ print $2 }' "$STAGED_SUMS" | sort)
          if [[ $here != "$listed" ]]; then
            echo "::error::the files to publish are not the files that were staged"
            diff <(printf '%s\n' "$listed") <(printf '%s\n' "$here") || true
            exit 1
          fi
          sha256sum --check --strict "$STAGED_SUMS"
          cp "$STAGED_SUMS" SHA256SUMS
          # <<< promote by digest

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/crucible-*.tar.gz
            assets/crucible-*.exe
            assets/install.sh
            assets/uninstall.sh
            assets/install.ps1

      - name: Publish, as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "crucible ${GITHUB_REF_NAME#v}" \
            --notes-file assets/NOTES.md \
            assets/crucible-* assets/install.sh assets/uninstall.sh assets/install.ps1 \
            assets/SHA256SUMS

      # What the release holds, read back from it rather than from the files
      # handed to it. Any difference leaves the draft unpublished.
      - name: The draft holds exactly the staged bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # >>> published as staged
          mkdir published
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir published
          cd published
          here=$(ls -1A | sort)
          listed=$({ awk '{ print $2 }' "$STAGED_SUMS"; echo SHA256SUMS; } | sort)
          if [[ $here != "$listed" ]]; then
            echo "::error::the draft does not hold the files that were staged"
            diff <(printf '%s\n' "$listed") <(printf '%s\n' "$here") || true
            exit 1
          fi
          cmp SHA256SUMS "$STAGED_SUMS"
          sha256sum --check --strict SHA256SUMS
          # <<< published as staged

      - name: Make the release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
