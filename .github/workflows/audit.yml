name: audit

# Advisory data changes without a source change, so this scan remains separate
# from deterministic blocking CI. License and source policy is owned by
# dependency-policy.yml; this workflow owns advisories only.
on:
  schedule:
    # Monday morning, so a week's worth of advisories is waiting at the start of
    # one rather than over a weekend.
    - cron: "0 6 * * 1"

  # A dependency change can introduce an advisory immediately, so scan that
  # change as well as the weekly schedule.
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, .github/workflows/audit.yml]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo install cargo-deny --version '=0.20.2' --locked
      - run: cargo deny --locked check advisories
