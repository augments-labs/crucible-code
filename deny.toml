# Dependency policy beyond manifest syntax.
#
# The local repository gate checks exact pins and their justification. Blocking
# CI reads this file for license, source and ban policy — three questions the
# lockfile in front of it answers on its own, so the verdict changes only when a
# dependency does. Advisory data can change without a source change, so
# `.github/workflows/audit.yml` owns that scan on dependency changes and a
# schedule.

[advisories]
# An advisory that genuinely does not reach us through crucible still gets an
# entry here with the reasoning, rather than a silent pass: the next person
# needs to know it was considered, not merely that the run is green.
ignore = [
    # bincode 1.x is unmaintained — the team stopped development after a
    # harassment incident, and there is no safe upgrade. It arrives under
    # `syntect`, whose `dump-load` feature is what reads the built-in syntax
    # definitions, and there is no version of that which does not.
    #
    # Why it does not reach us. Unmaintained is a notice about the project, not
    # a vulnerability in the code, and there is no advisory against what the
    # code does. What crucible has it decode is
    # `include_bytes!("assets/default_newlines.packdump")` — a blob compiled
    # into this binary from the crate that also wrote it. It never sees a
    # model's output, a file a reader supplied, or a byte off the network. A
    # syntax theme, which *is* a file a reader supplied, is read by `plist`
    # rather than by this.
    #
    # What would change the answer: an advisory against bincode's decoder
    # itself, or crucible ever loading a dump it did not compile in. The second
    # is the one to watch, because it would be an ordinary-looking feature —
    # "let people bring their own syntaxes" — that quietly turns a trusted
    # decoder into an untrusted one.
    "RUSTSEC-2025-0141",
]

[licenses]
# The binary is distributed under MIT, and that promise is only as true as what
# it statically links. A copyleft crate arriving three levels down would make
# LICENSE a false statement about the artifact, which no amount of care in this
# repository's own code would fix.
#
# Permissive only, and named rather than inferred from a category — a list you
# have to edit is a decision, and "whatever the tool calls permissive today" is
# not. Every entry is one this tree actually needs; an entry that stops being
# needed fails the run below rather than silently pre-approving something
# nobody chose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",

    # Native clipboard access brings two platform families with licences this
    # tree did not need before. `clipboard-win` and its `error-code` dependency
    # use Boost's permissive licence; the Wayland graph's hash table uses zlib's.
    # Both permit use, modification and binary redistribution with attribution,
    # impose no copyleft, and leave this binary's MIT terms intact.
    "BSL-1.0",
    "Zlib",

    # The odd one out, and worth knowing why it is here. `webpki-roots` carries
    # Mozilla's root certificate store, which is data rather than code, so it
    # is under the Linux Foundation's licence for datasets instead of a
    # software one. Permissive in the same sense as the rest: use, change and
    # redistribute it, keep the disclaimer, and nothing it touches inherits
    # terms. Without those roots there is nobody to trust at the other end of a
    # TLS handshake.
    "CDLA-Permissive-2.0",
]

# A licence nobody in the tree uses is an approval granted in advance to a
# dependency that has not been chosen yet. Removing the last crate that needed
# one is exactly when this list should be edited, and this is what makes that
# happen then rather than never.
unused-allowed-license = "deny"

[sources]
# The one hole `=`-pinning leaves open. A git dependency carries no version
# field at all, so the pinning gate has nothing to look at and passes it in
# silence — while the revision it names can be force-pushed under you. Every
# crate here comes from crates.io, where a published version is immutable.
unknown-registry = "deny"
unknown-git = "deny"

[bans]
# Two copies of one crate is two copies of one bug. When an advisory lands and
# the fix ships in the newer line, the older one keeps compiling quietly, and
# nothing in a green build says which of the two the vulnerable call went
# through. It also puts two `Error` types with the same name in one binary,
# which is where a `?` stops compiling for reasons that read as nonsense.
#
# So: a duplicate is a decision somebody makes here, with the reason written
# down, rather than something a lockfile update does on its own.
multiple-versions = "deny"

# `=`-pinning is the repository's rule for its own manifests, checked by
# `scripts/repo-checks.sh`. A wildcard would be the same hole from the other
# side: a dependency that resolves to whatever was published this morning.
wildcards = "deny"

# A crate in this workspace depends on its siblings by path and carries no
# version for them, which reads to the check above as a wildcard. It is not the
# hole that rule is about: a path dependency resolves to the tree in front of
# you, not to whatever was published.
allow-wildcard-paths = true

# Each entry below is one graph this tree cannot collapse on its own, named at
# the exact version so a new duplicate of the same crate still fails.
skip = [
    # `plist` reads a syntax theme a reader supplied and still wants base64 0.22;
    # everything crucible writes itself, and `ureq`, are on 0.23. The older copy
    # is reachable only through `syntect`'s theme loading, and it goes away when
    # `plist` moves — not before, and not by anything this repository can do.
    { crate = "base64:0.22.1", reason = "syntect's theme reader pins the older line" },

    # `ring` — the cryptography under rustls — is on getrandom 0.2, and rustls
    # has no build without it. Everything crucible reaches for directly, and
    # `uuid`, use 0.4. Both copies are the same thin wrapper over the operating
    # system's own random device, so the duplication costs bytes rather than
    # entropy.
    { crate = "getrandom:0.2.17", reason = "ring pins the older line under rustls" },

    # `petgraph`, four levels down under Wayland clipboard support, is on
    # hashbrown 0.15 while `indexmap` has moved to 0.17. Neither copy is on any
    # path crucible calls; they are the hash tables inside two libraries that
    # happen to disagree about a release.
    { crate = "hashbrown:0.15.5", reason = "petgraph pins the older line under arboard" },

    # `syn` is the Rust parser that procedural macros are written against. Both
    # copies are build-time only — neither is linked into the binary — and a
    # macro crate can only use the line it was written for. `zerocopy-derive`,
    # under image decoding, is on 2; everything newer is on 3.
    { crate = "syn:2.0.119", reason = "a proc-macro crate is written against one parser line" },

    # `windows-sys` is the generated binding to the Windows API, and which
    # version a crate picked says only which metadata release it was generated
    # from. `arboard` and `ring` are on 0.52 while the rest of the tree is on
    # 0.61; on every other platform both copies compile to nothing at all.
    { crate = "windows-sys:0.52.0", reason = "generated Windows bindings, one release behind" },
]

# Crates that must not appear at all, whatever brings them.
deny = [
    # TLS in this tree is rustls, with Mozilla's roots compiled in. OpenSSL
    # arriving underneath would mean a C library built at install time, a second
    # and differently-configured trust store deciding who is trusted at the far
    # end of a connection, and a licence question the list above does not cover.
    # A dependency that wants it has chosen a different design; that is worth
    # noticing when it arrives rather than after it ships.
    { crate = "openssl-sys", use-instead = "rustls", reason = "one TLS stack, in Rust, with one trust store" },
    { crate = "native-tls", use-instead = "rustls", reason = "one TLS stack, in Rust, with one trust store" },
]
