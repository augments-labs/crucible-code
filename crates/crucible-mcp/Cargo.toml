[package]
name = "crucible-mcp"
description = "Speaks the Model Context Protocol to a server somebody else wrote."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The bounded frames and the hosted-process streams every conversation in this
# workspace runs over, so the protocol here is the only thing this crate holds.
crucible-transport.workspace = true
# What a confined process is, so a server can be hosted over one without this
# crate knowing which backend confined it.
crucible-sandbox.workspace = true
# The cancellation a caller raises to stop waiting on a server mid-exchange,
# the future a hosted toolset and its tools hand back, and the bridge starting a
# server crosses while hosting is synchronous.
crucible-runtime.workspace = true
# What a tool and a toolset are, so a server's catalogue can be published as a
# generation the runner drives beside the built-in roster.
crucible-tools.workspace = true
# The identifiers and call arguments a hosted tool is named and invoked with.
crucible-types.workspace = true
# Reads and writes the JSON-RPC documents MCP frames carry.
serde_json.workspace = true
# Typed errors a caller can match on and hold with `#[from]`.
thiserror.workspace = true

# `answered!`, which the tests ask a hosting's future once with.
[dev-dependencies]
crucible-runtime = { workspace = true, features = ["proof"] }

[lints]
workspace = true
