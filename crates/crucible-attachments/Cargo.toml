[package]
name = "crucible-attachments"
description = "What may be attached to a request, and the one bounded way its bytes are taken."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `crucible-types` supplies `Modality`, which is what a kind says a file is to
# the request being built. `crucible-workspace` is the one ingress a path a
# model reached comes through; naming it here is what stops a caller from
# assembling the same read out of a path string.
#
# `sha2` derives the digest an attachment is identified by after it is read, so
# a file that changed between being attached and being sent is refused by the
# same value everywhere rather than by three separate hashes. `thiserror` writes
# the module-owned error enum.
[dependencies]
crucible-types.workspace = true
crucible-workspace.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Opening a pipe for reading blocks until somebody writes, so the descriptor a
# named path is answered from has to be asked for without waiting. `rustix`
# supplies the `O_NONBLOCK` bit std does not name; on Unix `crossterm` is
# already compiling this crate, so what arrives is a feature rather than a
# crate.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
