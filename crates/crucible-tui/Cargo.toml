[package]
name = "crucible-tui"
description = "Full-screen terminal rendering: prompt, streaming transcript, permission prompts."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
base64.workspace = true
crossterm.workspace = true
syntect.workspace = true
terminal-colorsaurus.workspace = true
two-face.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

# The foreground process group a sign-in child is given, and the terminal modes
# put back around it. `std` can put a child in a process group but has no
# `tcsetpgrp` and no `tcgetpgrp`, and neither does crossterm; `rustix` is
# already in the tree, so this turns on two safe wrappers rather than adding a
# crate. `libc` is the one call that ignores `SIGTTOU` while the parent, in the
# background, takes the terminal back; it is the workspace's libc and is read
# for its constants and one guarded `signal` call.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process", "termios"] }
# The timed read that confirms a terminal draws images, and the terminal it is
# read from. Unix only: Windows draws text this release and is asked nothing.
terminal-trx.workspace = true
mio.workspace = true

[lints]
workspace = true

# What a component drew, against a file checked in beside it. See the comment
# in the root manifest for when a test may reach for this and when it may not.
[dev-dependencies]
insta.workspace = true

# The pty the foreground-group case runs a child on: `std` can spawn the
# process and hand it descriptors but cannot open the pty pair or set its
# window size.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios"] }

# What a drawer crate's tests check a drawing with: the fit sweep's widths and
# rooms, `dump` and the fit check, and the corpus of answers with the helpers
# that read one through the reader with a drawer registered
# (`src/testing.rs`). Turned on only by a dev-dependency, so no release build
# carries it; `scripts/sh/repo-checks.sh` holds the manifests to that.
[features]
testing = []
