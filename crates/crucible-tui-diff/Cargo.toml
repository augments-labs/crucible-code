[package]
name = "crucible-tui-diff"
description = "A change to files, read from a unified diff or handed over by a tool, drawn as boxed rows."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The drawing contract this crate implements, and the rows, slots and glyphs
# it lays a change out in. `similar` finds which words of a changed line
# changed. `thiserror` writes the `Display` of `NotADiff`.
[dependencies]
crucible-tui.workspace = true
similar.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# The fit sweep's widths and rooms, `dump` and the fit check, for this crate's
# own tests only; a release build of the crate never turns `testing` on. `insta`
# compares the pictures of a change checked in beside the drawer.
[dev-dependencies]
crucible-tui = { workspace = true, features = ["testing"] }
insta.workspace = true
