[package]
name = "crucible-tools"
description = "Filesystem, search and process tools the agent can call."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The one bounded ingress a picture handed back by `read` comes through, and the
# closed table saying which files are pictures at all. A second reading here
# would let a file be attachable to a tool and not to a prompt.
crucible-attachments.workspace = true
crucible-core.workspace = true
crucible-sandbox-broker.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
httparse.workspace = true
http.workspace = true
# Ephemeral per-command proxy credentials use the existing random source and
# standard Basic-auth encoder; they never enter persistence or diagnostics.
getrandom.workspace = true
base64.workspace = true
serde_json.workspace = true

# SHA-256 of a sandbox helper's own bytes, which is the provenance a run is
# admitted on: the executable about to isolate a command is identified by what
# it contains rather than by where it was found.
sha2.workspace = true

# `kill` on a process group, which is how a command's whole pipeline is stopped
# rather than the shell at the head of it. `std` signals the one child it
# spawned; the negated group id reaches the rest, and there is no call in `std`
# that takes one. Unix targets only, and already in the tree under
# `crucible-core`, so this turns a feature on rather than adding a crate.
# Confined to `bash/platform/unix.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Windows sandbox scratch directories need the same protected owner-only DACL
# as other private local state before the dedicated account is granted access.
crucible-privacy.workspace = true

# Windows refuses std::fs::rename over an existing file, has no safe job-object
# API for containing descendants, cannot discover the suspended primary thread
# that must be resumed after job attachment, and cannot poll anonymous pipes
# through std. Those bindings stay inside the atomic and process boundaries;
# all features and the exact version are pinned once at the workspace root.
windows-sys.workspace = true

[lints]
workspace = true
