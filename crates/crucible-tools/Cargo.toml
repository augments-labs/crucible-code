[package]
name = "crucible-tools"
description = "Filesystem, search and process tools the agent can call."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The one bounded ingress a picture handed back by `read` comes through, and the
# closed table saying which files are pictures at all. A second reading here
# would let a file be attachable to a tool and not to a prompt.
crucible-attachments.workspace = true
crucible-core.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The confinement a command is actually run under. Tools name the service
# contract, not a machine; the tests need one machine's answer to it, and its
# `testing` feature for the real child the reaper and the early-return guard
# are exercised against.
crucible-sandbox-local = { workspace = true, features = ["testing"] }

# SHA-256 of what the test journal writes down, so a stored result is
# identified by what it contains rather than by when it was put there.
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
# Windows refuses std::fs::rename over an existing file, and cannot poll
# anonymous pipes through std. Those bindings stay inside the atomic boundary;
# all features and the exact version are pinned once at the workspace root.
windows-sys.workspace = true

[lints]
workspace = true
