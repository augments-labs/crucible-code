[package]
name = "crucible-tools"
description = "Filesystem, search and process tools the agent can call."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crucible-core.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
serde_json.workspace = true

# `kill` on a process group, which is how a command's whole pipeline is stopped
# rather than the shell at the head of it. `std` signals the one child it
# spawned; the negated group id reaches the rest, and there is no call in `std`
# that takes one. Unix targets only, and confined to `bash/output.rs`.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
