[package]
name = "crucible-tools"
description = "What a tool is, what may run one, and the proof that it may."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
crucible-registry.workspace = true
crucible-runtime.workspace = true
crucible-sandbox.workspace = true
crucible-storage.workspace = true
crucible-types.workspace = true
crucible-workspace.workspace = true
# A permission rule is a glob, and the `glob` tool matches with this crate too:
# a second matcher would let `src/**` mean one thing in a rule and another in a
# search, and the two would disagree exactly where it costs most.
globset.workspace = true
thiserror.workspace = true
# The tool worker's blocking work: `rt` for the handle it is spawned onto, `sync`
# for the permits that bound how much of it runs at once, and `time` for the
# tick a call waiting for a permit looks at its cancellation on. The runtime is
# the application's, handed in; nothing here builds one.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid.workspace = true

# `answered!`, which drives a fake's future by hand in a test.
[dev-dependencies]
crucible-runtime = { workspace = true, features = ["proof"] }

[lints]
workspace = true
