[package]
name = "crucible-sandbox"
description = "What a confined process may observe or change, stated without naming a backend."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A policy names the directories it grants and the call it is attributed to, so
# this crate takes the two crates that own those values and nothing above them.
# `crucible-storage` is here for one reason: a sandboxed call hands back the
# same receipt an unsandboxed one does, and the trait says so in its signature.
# `crucible-runtime` is here for the future a lifecycle step hands back, which is
# the same type every other service contract hands back.
#
# `thiserror` writes `Display` and `source` for the refusal enums; `sha2`
# digests a policy so two of them can be compared without either being shown;
# `globset` compiles the command patterns a guardrail matches.
[dependencies]
crucible-runtime.workspace = true
crucible-storage.workspace = true
crucible-types.workspace = true
crucible-workspace.workspace = true
globset.workspace = true
sha2.workspace = true
thiserror.workspace = true

# `time` is the pause the default waiting read takes between asking a stream
# that can say only whether bytes are ready now, and `rt` is how that read
# finds out it was polled off a runtime and says so instead of panicking, and
# the blocking thread the default asynchronous input writes on, so a pipe that
# fills holds that thread rather than a worker. Nothing here builds a runtime:
# both run on their caller's.
tokio = { workspace = true, features = ["rt", "time"] }

# `answered!`, which drives a fake's future by hand in a test.
[dev-dependencies]
crucible-runtime = { workspace = true, features = ["proof"] }
# A runtime of one worker, which is how a test sees whether the default
# asynchronous input holds the thread that polls it. Nothing of it reaches the
# library.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
