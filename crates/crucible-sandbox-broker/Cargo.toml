[package]
name = "crucible-sandbox-broker"
description = "Minimal PID-1 supervisor for one confined Crucible command."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The inherited status channel must become close-on-exec before the workload
# starts. std cannot change descriptor flags; this is the workspace's existing
# safe Linux system-call boundary.
rustix.workspace = true

[[bin]]
name = "crucible-sandbox-broker"
path = "src/main.rs"
test = false
bench = false

[lints]
workspace = true
