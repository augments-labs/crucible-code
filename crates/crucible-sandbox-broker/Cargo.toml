[package]
name = "crucible-sandbox-broker"
description = "Minimal native launcher and supervisor for one confined Crucible command."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Complete pre/post-overlay content seals decide which bounded file payloads
# cross back to the host. This is the workspace's existing SHA-256 primitive.
sha2.workspace = true

# The inherited status channel must become close-on-exec before the workload
# starts, and PID 1 must kill/reap the complete workload scope before scanning.
# std covers neither operation; this is the workspace's existing safe Linux
# system-call boundary.
rustix = { workspace = true, features = ["event", "net", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The Windows broker is the trusted bridge between the host process and the
# dedicated low-privilege account. Raw platform bindings are required for
# account setup, encrypted state, WFP policy and maintenance serialization; the
# exact version and feature surface are pinned at workspace root.
windows-sys.workspace = true

[[bin]]
name = "crucible-sandbox-broker"
path = "src/main.rs"
bench = false

[lints]
workspace = true
