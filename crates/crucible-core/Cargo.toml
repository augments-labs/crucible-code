[package]
name = "crucible-core"
description = "Domain types and the traits every other crucible crate implements."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Core is the bottom of the graph, so a dependency added here is one every layer
# above inherits. `thiserror` earns it: rule 1 requires a module-owned error
# enum on every fallible function, and it is derive-only — the macro writes the
# `Display` and `source` impls at compile time and nothing of the crate survives
# into the binary.
#
# `sha2` earns the same bottom-of-graph cost where a policy has to be named by
# what it says rather than by where it was read from: an extension manifest is
# identified by a domain-separated one-way digest, so a resumed run can tell
# that the thing it is about to trust is the thing that was approved. The
# credential and sandbox digests that once shared this dependency moved out
# with their types. The exact-pinned crate is named by every crate that
# identifies something by what it says.

# The nine crates below are the extraction this crate is being emptied into.
# Core consumes them so its remaining callers keep compiling against one name
# while ownership moves; every one of these edges is retired when core is
# removed.
[dependencies]
crucible-attachments.workspace = true
crucible-credentials.workspace = true
crucible-registry.workspace = true
crucible-runtime.workspace = true
crucible-sandbox.workspace = true
crucible-storage.workspace = true
crucible-tools.workspace = true
crucible-types.workspace = true
crucible-workspace.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[lints]
workspace = true
