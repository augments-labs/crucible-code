[package]
name = "crucible-core"
description = "Domain types and the traits every other crucible crate implements."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Core is the bottom of the graph, so a dependency added here is one every layer
# above inherits. `thiserror` earns it: rule 1 requires a module-owned error
# enum on every fallible function, and it is derive-only — the macro writes the
# `Display` and `source` impls at compile time and nothing of the crate survives
# into the binary.
#
# `globset` earns it because a permission rule is a glob and the `glob` tool is
# already matched with this crate. Writing a second matcher here would mean
# `src/**` could come to mean one thing in a rule and another in a search, and
# the two would disagree exactly where it costs most — a rule that looks like it
# covers a file the tool does not think it covers.
[dependencies]
globset.workspace = true
thiserror.workspace = true

# The descriptor walk that opens a path the workspace proved, which is what
# makes containment hold against something else writing into the tree at the
# same time. Every crate above inherits it, on Unix targets — and there it is
# already being compiled for `crossterm`, so what arrives is a feature rather
# than a crate. Windows has no `openat`; the separate target dependency below
# validates final opened handles and commits new files under a held parent.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# A name can be redirected through an ancestor between containment and open.
# GetFinalPathNameByHandleW validates the handle actually opened before a byte
# is read; std exposes the handle but not that query. The exact-pinned crate and
# FileSystem feature are already in the workspace for privacy.
windows-sys.workspace = true

[lints]
workspace = true
