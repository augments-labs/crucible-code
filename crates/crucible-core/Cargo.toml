[package]
name = "crucible-core"
description = "Domain types and the traits every other crucible crate implements."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Core is the bottom of the graph, so a dependency added here is one every layer
# above inherits, and what is left here earns that cost. `serde_json` writes a
# run item's recorded tool output as the one text a journal retains, which is a
# document format rather than a string this crate could compose itself.
#
# The twelve crates below are the extraction this crate is being emptied into.
# Core consumes them so its remaining callers keep compiling against one name
# while ownership moves; every one of these edges is retired when core is
# removed.
[dependencies]
crucible-attachments.workspace = true
crucible-context.workspace = true
crucible-credentials.workspace = true
crucible-models.workspace = true
crucible-registry.workspace = true
crucible-runtime.workspace = true
crucible-sandbox.workspace = true
crucible-storage.workspace = true
crucible-tools.workspace = true
crucible-transport.workspace = true
crucible-types.workspace = true
crucible-workspace.workspace = true
serde_json.workspace = true

[lints]
workspace = true
