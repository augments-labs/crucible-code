[package]
name = "crucible-auth"
description = "The keys crucible was given, written down where only this user can read them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Account login, token exchange and renewal. Blocking matches the rest of the
# binary's thread-per-operation design; this crate never runs it on startup.
ureq.workspace = true
# Decodes only the bounded JWT claim segment needed for ChatGPT account
# selection. Token bytes stay inside the credential type.
base64.workspace = true
# Cryptographic state, PKCE verifiers and stable installation identifiers come
# from the operating system rather than a process-local pseudo-random generator.
getrandom.workspace = true
# Computes the RFC 7636 S256 challenge for callback-based account logins.
sha2.workspace = true
# `ApiKey`, which is what a stored key becomes on the way out. The secret is
# handed back as the type that can only be applied to a request, never as the
# string it was written down as.
crucible-core.workspace = true
# Owner-only creation and tightening for the auth directory, store, partial
# and lock, shared with session files so Windows has one DACL implementation.
crucible-privacy.workspace = true
# The store is JSON, read the same keyless way every other boundary here reads
# one: the file is a version and a map of provider to key, and walking it is
# shorter than a mirror struct plus the derive that fills it.
serde_json.workspace = true
# `AuthError`, which the wiring turns into something the user reads.
thiserror.workspace = true

[lints]
workspace = true
