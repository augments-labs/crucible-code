[package]
name = "crucible-raster"
description = "Pictures and image files as bounded pixels, and as PNG and Sixel payloads."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `resvg` draws the SVG a drawer wrote into pixels, with the font and the
# colours the caller hands it. `icy_sixel` quantises and encodes pixels as the
# payload a Sixel terminal draws. `image` decodes an image file under limits and
# encodes the PNG payload. `thiserror` writes the `Display` of the refusal.
[dependencies]
image.workspace = true
resvg.workspace = true
icy_sixel.workspace = true
thiserror.workspace = true

[lints]
workspace = true
