[package]
name = "crucible-extension"
description = "What an extension is, whether it may run, and talking to one that does."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Nothing above a contract, deliberately. A crate that named a concrete sandbox
# backend or read a settings document here would be deciding what it is only
# supposed to run.
[dependencies]
# `SourceKind`, which is how a manifest records where its bytes came from and
# what a trust decision is made against.
crucible-registry.workspace = true
# The process an extension runs as: `SandboxProcess` to watch and stop it, and
# `SandboxOutput` for the stream it talks over.
crucible-sandbox.workspace = true
# The half of talking to somebody else's program that this protocol does not
# own: bounded frames, the streams they travel over, and the restart budget.
crucible-transport.workspace = true
# `later`, the one rule for which of two release names is ahead, so a manifest
# naming a crucible newer than this one is refused the same way an update is
# offered.
crucible-types.workspace = true
# Manifests and everything said over the wire are JSON, and a hand-written
# reader for somebody else's file is a parser crucible would then own.
serde_json.workspace = true
# A manifest is identified by a domain-separated one-way digest of what it
# says, so a resumed run can tell that the thing it is about to trust is the
# thing that was approved.
sha2.workspace = true
# Every refusal here is a module-owned enum, and the derive writes the
# `Display` and `source` impls rather than shipping a runtime.
thiserror.workspace = true
# `Handle`, the runtime a hosted extension's streams are read and written on
# by the transport's tasks, and the reading and writing traits a conversation
# is awaited over. Named here only to be handed down and bound on: nothing in
# this crate spawns, builds or enters a runtime.
tokio = { workspace = true, features = ["rt"] }

# `std` opens a manifest and takes the flag that keeps the open from waiting on
# a writer as a raw integer, naming no value for it, and that value is in a
# different bit on every platform — so this names the one constant `std` does
# not. The open is `std`'s, so nothing here is asked to open anything.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
# `BoxFuture`, which a stand-in process in the tests returns from its stop.
crucible-runtime.workspace = true
# The runtime the tests hand a hosted extension's streams to: its workers run
# the transport's tasks while a test's own thread waits on what it awaits, and
# it has the timer a stream's waiting read and a test's own timeout need.
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
