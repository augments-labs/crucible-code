[package]
name = "crucible-config"
description = "Where crucible's own files are, what they may say, and which of them wins."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# The rungs a provider's effort setting becomes, and how one layer's
# prompt-cache policy is held under the layer it inherits.
crucible-models.workspace = true
# The sandbox policy a resolved setting turns into, and the ceilings its
# filesystem and network rules are held under.
crucible-sandbox.workspace = true
# `Verdict` and the newtypes a resolved setting turns into — the rules a
# permission setting is written as, and the tool names they are settled against
# — so the wiring above receives domain types rather than strings it has to
# interpret again.
crucible-tools.workspace = true
# `Tone` and the prompt-cache vocabulary a resolved setting is turned into.
crucible-types.workspace = true
# `Workspace`, which a path a setting names is proved against.
crucible-workspace.workspace = true
# The document is JSON. Read without `derive`, the same way every other boundary
# in this workspace reads one: the shape is walked against `shape::DOCUMENT`, so
# a mirror struct per block would be a second declaration of the same keys and
# the schema could no longer be generated from one of them.
serde_json.workspace = true
# `ConfigError`, which the wiring turns into something the user reads.
thiserror.workspace = true

# `std` opens a settings layer and takes the flag that keeps the open from
# waiting on a writer as a raw integer, naming no value for it, and that value
# is in a different bit on every platform — so this names the one constant `std`
# does not. The open is `std`'s, so nothing here is asked to open anything.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
