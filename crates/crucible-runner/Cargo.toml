[package]
name = "crucible-runner"
description = "Drives turns to completion: streams from a provider, dispatches tool calls."
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No provider and no tool, deliberately. The runner drives `dyn Provider` and
# `dyn Tool`; naming a concrete one here is the design failure this crate exists
# to prevent.
[dependencies]
# The one bounded ingress an attachment's bytes come through. Resolving an
# attachment reads the recorded file again, and doing that here would be a
# second answer to what one request may carry.
crucible-attachments.workspace = true
crucible-core.workspace = true
# The log a turn is recorded to. Re-exported, so the wiring names one crate
# for the loop and the session alike.
crucible-session.workspace = true
# The prompt-cache scope is named by a domain-separated digest of what it
# covers, so a resumed run reuses a cache entry only where the same inputs
# produced it.
sha2.workspace = true

[lints]
workspace = true
